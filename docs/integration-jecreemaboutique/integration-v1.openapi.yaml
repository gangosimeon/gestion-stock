# =============================================================================
# Contrat d'intégration GestStock × JeCréeMaBoutique — version 1 — PROPOSITION
#
# Statut : document de conception soumis à approbation (lot 0). v15 : les
# routes /oauth/par, /oauth/token, GET /link, POST /link/revoke et
# POST /link/secret existent (lot 2, non déployé) et ce fichier les décrit
# telles qu'implémentées ; les autres routes n'existent pas encore. Aucun
# endpoint existant hors intégration n'est modifié. Ne pas générer de code à
# partir de ce fichier avant approbation.
#
# Réalité auditée prise en compte :
#  - GestStock : Spring Boot, une base PostgreSQL par entreprise, schéma platform,
#    TenantContext résolu depuis le jeton ; erreurs au format ApiError (RFC 9457)
#    déjà utilisé par l'API (exception/ApiError) ; ventes : prix relus par le
#    serveur, caisse ouverte obligatoire pour un paiement.
#  - JeCréeMaBoutique : Next.js + MongoDB ; la boutique est un compte User ;
#    commandes publiques sans compte client.
#
# Marquage : « [Hypothèse] » = choix non validé ; « [Décision Dn] » = renvoi au
# plan 01-audit-et-plan.md.
# =============================================================================
info:
  title: GestStock — API d'intégration boutique en ligne
  version: 1.0.0-draft
  license:
    name: Propriétaire — usage restreint
    identifier: LicenseRef-Proprietary
  description: |
    API de service à service entre le backend GestStock (fournisseur) et le backend
    JeCréeMaBoutique (client). **Jamais appelée depuis un navigateur.**

    Principes :
    - L'entreprise GestStock est déduite de la **liaison authentifiée** (jeton), jamais d'un paramètre.
    - Chaque appel relit le statut de la liaison (`ACTIVE` exigé) : révocation et suspension immédiates.
      Liaison `SUSPENDED` : `403 LINK_SUSPENDED` partout, sauf `GET /link` et `POST /link/revoke`
      (v14-D10).
    - Deux niveaux d'identifiants (v14-D3) : le **client** JeCréeMaBoutique (un par environnement,
      HTTP Basic sur `/oauth/par` et `/oauth/token`) et un **secret par liaison** (`client_credentials`,
      rotation par `POST /link/secret`).
    - Synchronisation **tirée** : JeCréeMaBoutique lit le flux de changements à partir de son curseur,
      par interrogation périodique (v13-D3 : conteneur consommateur du VPS JeCréeMaBoutique, toutes les
      30 à 60 s, configurable). **Aucun webhook en v1** (v13-D3) ; une notification sans données pourra
      être ajoutée dans une version ultérieure.
    - Écritures idempotentes : une requête rejouée renvoie le résultat déjà enregistré (même statut,
      même corps). Création de commande : clé naturelle (liaison, `externalOrderId`) (C4, v13-D5) ;
      autres écritures : en-tête `Idempotency-Key` obligatoire, conservée 7 jours (v13-D5).
    - Limitation de débit (C1, v13-D4) : `429` avec `Retry-After` ; compteurs indisponibles : `503`,
      jamais de laisser-passer. Sur `/oauth/par` et `/oauth/token`, deux compteurs séparés (v15) : par
      IP **avant** l'authentification du client (toutes tentatives comprises), par client **après** une
      authentification réussie seulement.
    - Formats d'erreur (v15) : `/oauth/par` et `/oauth/token` répondent au format `OAuthError`
      (`application/json`), sauf la limitation de débit (`429`, `503 RATE_LIMIT_UNAVAILABLE`), au format
      `ApiError` (`application/problem+json`) ; toutes les autres routes répondent au format `ApiError`.
      Corps JSON illisible : `400 MALFORMED_REQUEST`. Requête refusée par le pare-feu HTTP avant toute
      route (par exemple `%00` dans l'URL, caractère de contrôle dans un en-tête) : `400` **sans corps**.
      Liaisons désactivées : `404 RESOURCE_NOT_FOUND` sur toute la chaîne. Erreur inattendue :
      `500 INTERNAL_ERROR` (`ApiError`), sur toutes les routes, `/oauth/*` compris.
    - Caractères de contrôle (U+0000 à U+001F, U+007F ; v15) refusés dans tout champ texte reçu, nom de
      paramètre compris, sans rien enregistrer : `400 invalid_request` sur `/oauth/*`,
      `400 VALIDATION_FAILED` ailleurs, `401 invalid_client` dans l'identifiant du client. Tabulation et
      sauts de ligne sont permis dans le **seul** motif libre de `POST /link/revoke`. Aucune valeur reçue
      n'est reprise dans un message d'erreur ni dans les journaux.
    - Versionnement : préfixe `/api/integration/v1` ; un changement incompatible crée `/v2`.
      Ajouter un type d'événement n'est pas incompatible : le consommateur ignore un `type` inconnu
      et avance son curseur (décision C7).
    - Portées : `orders:write` implique `orders:read` (décision C5).

    Décisions appliquées (2026-10-28) : C2, C3, C4, C5, C6, C7 ; conception détaillée P0 à P8 ;
    v9-D1 (`410 CURSOR_EXPIRED`), v9-D2 (`pageToken` ≤ 512), v9-D3 (portes du lot 1). Statut de C3 :
    **validée (porte de sortie du Lot 1, 2026-10-29)** *(v9-v11 : « approuvée — conception détaillée
    approuvée — validation technique prévue en sortie du lot 1 »)*.
    **C1 tranchée (v13-D4)** ; **C8 tranchée (v13-D5)**, sauf la durée de conservation des données
    client, **encore ouverte** (lot 5) ; la devise et `perWarehouse` avaient été tranchés en v11.
    *(v12 et antérieures : « C1 et C8 restent ouvertes, sauf la devise et `perWarehouse` ».)*

    Décisions v11 (2026-10-29, plan § 24) : `409 CURSOR_AHEAD` et deux codes `400` sur
    `/catalog/changes` ; type d'événement inconnu servi tel quel ; `occurredAt` informatif ;
    `currency` et `imageSha256` retirés de `Product` (devise dans l'en-tête de l'instantané et sur la
    liaison, état de l'image par `PRODUCT_IMAGE` seulement) ; `perWarehouse` exposé ; forme de
    l'instantané (en-tête, quatre sections, objets archivés inclus).

    Décisions v12 (2026-10-29, plan § 25) : lot 1 terminé (non déployé) et C3 validée à sa porte de
    sortie ; dans l'instantané, un produit absent des sections `productImages` ou `availability` est
    dans son état initial et la dernière page peut être vide.

    Décisions v13 (2026-10-29, plan § 26) : hébergement réel (backend GestStock sur Vercel, sans
    processus permanent ; backend JeCréeMaBoutique sur un VPS) ; consommation du flux par
    interrogation, webhook retiré de la v1 ; C1 tranchée (compteurs en base plateforme, `429` avec
    `Retry-After`, `503` si les compteurs sont indisponibles) ; C8 tranchée sauf la durée de
    conservation des données client : jeton de liaison de 15 min, clé de signature distincte,
    rotation du secret de liaison, `Idempotency-Key` conservée 7 jours, 100 lignes et quantité
    ≤ 9 999 par commande, `discountPercent` retiré, nom et téléphone du client obligatoires, adresse
    seulement pour une livraison, pas d'e-mail ; liste blanche facultative de l'IP du VPS.

    Décisions v14 (2026-10-29, plan § 27) : parcours de liaison par demande déposée de serveur à
    serveur (`POST /oauth/par`, RFC 9126) puis code d'autorisation avec PKCE S256 ; une boutique liée
    à une seule entreprise à la fois ; deux niveaux d'identifiants (client et liaison) ; jeton
    `iss=geststock-integration`, claim `typ=integration`, en-tête `typ=at+jwt` (RFC 9068) ; secret de
    liaison haché en SHA-256 et comparé en temps constant ; rotation par `POST /link/secret` ;
    suspension avec motif (`403 LINK_SUSPENDED`) ; code rejoué refusé et liaison créée par ce code
    révoquée.

    Décisions v15 (plan § 28) : contrat aligné sur les routes du lot 2 telles qu'implémentées
    (le code fait foi) : `iss` dans l'URL de retour, `OAuthError.code` et `temporarily_unavailable`,
    codes `COMPANY_*` et `SCHEMA_UPGRADE_*`, encodage de l'en-tête Basic, `Link.companyName`,
    caractères de contrôle, compteurs du limiteur.
