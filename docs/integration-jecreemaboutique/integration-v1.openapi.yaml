      purgeRule: 'plafond P = last_seq lu dans la base de l''entreprise avant la liste des liaisons, immuable pendant le passage ; liaisons ACTIVE ou SUSPENDED de l''entreprise courante ; une liaison sans acquittement bloque la purge ; borne = min(P, MAX(seq) - 1, premier seq de moins de 90 jours - 1, plus petit acquittement s''il existe) ; suppression de repère < seq <= borne, préfixe contigu ; événements sans seq conservés ; lots autonomes, durée vérifiée entre deux lots'
      technicalValidationPending: []
      technicallyValidated: ['test de concurrence activation, instantané, purge (PurgeActivationRaceIT, plan § 30.10) : vert sur les vrais composants le 2026-11-03']
      contractChanges:
        - 'POST /catalog/changes/ack : 409 CURSOR_AHEAD au lieu de 422 ; acquittement par liaison, jamais en recul, idempotent par valeur, accepté sous le repère de purge ; seq strict (400 MALFORMED_REQUEST ou VALIDATION_FAILED) ; limite de 60 par minute et par liaison appliquée avant la lecture du corps ; 400, 401, 403, 404, 415, 429, 500 et 503 détaillés ; acknowledgedSeq obligatoire'
        - 'GET /catalog/changes : renvoi à D5 et au plan § 30.4 pour la rétention et la purge'
        - 'G17 (2026-11-03) : route implémentée ; type de contenu absent ou non JSON : 415 ; corps de plus de 1 024 octets : 413 CONTENT_TOO_LARGE ; champs inconnus ignorés ; clés répétées et contenu après l''objet : 400 MALFORMED_REQUEST'
      g18:
        date: '2026-11-03'
        source: 'plan § 31 (G18 réalisée)'
        implemented: 'GET /catalog/snapshot (backend GestStock, lot 3, étape G18), non déployé'
        decided:
          - 'G18-D1 : sans la portée stock:read, le champ availability est absent de chaque page (absent = non autorisé, jamais vide = 0) et l''instantané s''arrête après productImages (v17-D1)'
          - 'G18-D2 : jeton de page placé sur la section availability, présenté sans stock:read : 200, dernière page vide, sans nextPageToken ni quantité'
        contractChanges:
          - 'GET /catalog/snapshot : portée et disponibilité ; paramètres (répété, non entier : 400 INVALID_PARAMETER ; limit hors bornes : 400 VALIDATION_FAILED ; pageToken vide ou de plus de 512 caractères : 400 INVALID_PAGE_TOKEN) ; 404 LinksDisabled ; 500 InternalError ; 503 détaillé ; 429 par liaison, compteur propre ; Cache-Control: no-store'
          - 'SnapshotPage : availability retiré des champs obligatoires, absent sans stock:read'
      g19:
        date: '2026-11-03'
        source: 'plan § 32 (G19 réalisée)'
        implemented: 'GET /catalog/products/{productId}/image (backend GestStock, lot 3, étape G19), non déployé'
        decided:
          - 'G19-D1 : image JPEG binaire, lue dans la base de l''entreprise de la liaison (pas d''URL)'
          - 'G19-D2 : ETag fort = empreinte SHA-256 (= imageSha256) ; If-None-Match correspondant : 304 ; Cache-Control: no-store conservé ; pas de Last-Modified'
          - 'G19-D3 : un seul 404 PRODUCT_IMAGE_NOT_FOUND (produit inexistant, d''une autre entreprise ou sans image)'
          - 'G19-D4 : image servie pour un produit archivé'
          - 'G19-D5 : identifiant non canonique : 400 INVALID_PARAMETER sans la valeur'
          - 'G19-D6 : 120 appels par minute et par liaison, 304 compris, compteur propre'
          - 'G19-D7 : erreurs en application/problem+json quel que soit Accept'
          - 'G19-D8 : Content-Type image/jpeg, Content-Length, ETag, X-Content-Type-Options: nosniff, Cache-Control: no-store ; HEAD implicite'
          - 'G19-D9 : le client enregistre l''ETag reçu, pas l''empreinte de l''événement'
        observed:
          - 'If-None-Match: * : 200, pas 304 (comportement de Spring MVC, comme l''API principale ; non tranché par une décision)'
        contractChanges:
          - 'GET /catalog/products/{productId}/image : operationId getCatalogProductImage (getProductImage était déjà attribué par l''API principale) ; réponses 400, 404 détaillé, 429, 500, 503 ; en-têtes ; règles G19-D1 à G19-D9'
servers:
  - url: '{geststockApiOrigin}/api/integration/v1'
    description: 'Backend GestStock hébergé sur Render (v16-D1 ; v13-D1 : Vercel), appelé directement, jamais à travers le relais nginx du frontend (v14-D8) ; URL publique de production non encore fixée dans ce contrat (D8).'
    variables:
      geststockApiOrigin:
        default: https://geststock-backend.invalid
        description: Placeholder volontairement invalide ; à remplacer après confirmation D8.

security:
  - linkToken: []

tags:
  - name: Autorisation
    description: "Dépôt de la demande d'autorisation (PAR), échange du code d'autorisation (PKCE) et obtention des jetons de liaison."
  - name: Liaison
    description: "État et révocation de la liaison entre une entreprise GestStock et une boutique."
  - name: Catalogue
