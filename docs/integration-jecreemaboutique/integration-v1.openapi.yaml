openapi: 3.1.0
# =============================================================================
# Contrat d'intégration GestStock × JeCréeMaBoutique — version 1 — PROPOSITION
#
# Statut : document de conception soumis à approbation (lot 0). Aucun de ces
# endpoints n'existe encore ; aucun endpoint existant n'est modifié. Ne pas
# générer de code à partir de ce fichier avant approbation.
#
# Réalité auditée prise en compte :
#  - GestStock : Spring Boot, une base PostgreSQL par entreprise, schéma platform,
#    TenantContext résolu depuis le jeton ; erreurs au format ApiError (RFC 9457)
#    déjà utilisé par l'API (exception/ApiError) ; ventes : prix relus par le
#    serveur, caisse ouverte obligatoire pour un paiement.
#  - JeCréeMaBoutique : Next.js + MongoDB ; la boutique est un compte User ;
#    commandes publiques sans compte client.
#
# Marquage : « [Hypothèse] » = choix non validé ; « [Décision Dn] » = renvoi au
# plan 01-audit-et-plan.md.
# =============================================================================
info:
  title: GestStock — API d'intégration boutique en ligne
  version: 1.0.0-draft
  license:
    name: Propriétaire — usage restreint
    identifier: LicenseRef-Proprietary
  description: |
    API de service à service entre le backend GestStock (fournisseur) et le backend
    JeCréeMaBoutique (client). **Jamais appelée depuis un navigateur.**

    Principes :
    - L'entreprise GestStock est déduite de la **liaison authentifiée** (jeton), jamais d'un paramètre.
    - Chaque appel relit le statut de la liaison (`ACTIVE` exigé) : révocation et suspension immédiates.
    - Synchronisation **tirée** : JeCréeMaBoutique lit le flux de changements à partir de son curseur ;
      la notification signée (webhook) n'est qu'un signal.
    - Écritures idempotentes : en-tête `Idempotency-Key` obligatoire ; une requête rejouée renvoie le
      résultat déjà enregistré (même statut, même corps).
    - Versionnement : préfixe `/api/integration/v1` ; un changement incompatible crée `/v2`.
      Ajouter un type d'événement n'est pas incompatible : le consommateur ignore un `type` inconnu
      et avance son curseur (décision C7).
    - Portées : `orders:write` implique `orders:read` (décision C5).

    Décisions appliquées (2026-10-28) : C2, C3, C4, C5, C6, C7 ; conception détaillée P0 à P8 ;
    v9-D1 (`410 CURSOR_EXPIRED`), v9-D2 (`pageToken` ≤ 512), v9-D3 (portes du lot 1). Statut de C3 :
    **validée (porte de sortie du Lot 1, 2026-10-29)** *(v9-v11 : « approuvée — conception détaillée
    approuvée — validation technique prévue en sortie du lot 1 »)*.
    C1 (limitation de débit) et C8 (hypothèses marquées « [Hypothèse] ») restent **ouvertes**, sauf
    la devise et `perWarehouse`, tranchés en v11.

    Décisions v11 (2026-10-29, plan § 24) : `409 CURSOR_AHEAD` et deux codes `400` sur
    `/catalog/changes` ; type d'événement inconnu servi tel quel ; `occurredAt` informatif ;
    `currency` et `imageSha256` retirés de `Product` (devise dans l'en-tête de l'instantané et sur la
    liaison, état de l'image par `PRODUCT_IMAGE` seulement) ; `perWarehouse` exposé ; forme de
    l'instantané (en-tête, quatre sections, objets archivés inclus).

    Décisions v12 (2026-10-29, plan § 25) : lot 1 terminé (non déployé) et C3 validée à sa porte de
    sortie ; dans l'instantané, un produit absent des sections `productImages` ou `availability` est
    dans son état initial et la dernière page peut être vide.
  x-status: proposition-lot-0
  x-decisions:
    approved: [C2, C3, C4, C5, C6, C7]
    technicalValidationPending: []
    technicallyValidated: ['C3 : validée (porte de sortie du Lot 1, 2026-10-29)']
    open: [C1, C8]
    detailedDesign:
      date: '2026-10-28'
      approved: [P0, P1, P2, P3, P4, P5, P6, P7]
      verificationPending: []
      deploymentRule: ['P8 (v11-D12) : URL de migration vers l''hôte direct, sans -pooler']
      toConfirm: ['P3 : classement de CHANNEL_PRICE et ONLINE_ORDER_STATUS']
    v9:
      date: '2026-10-28'
      approved: [v9-D1, v9-D2, v9-D3]
      c3Status: 'approuvée — conception détaillée approuvée — validation technique prévue en sortie du lot 1'
      gates:
        lot1Entry: 'conception détaillée C3 approuvée (P0 à P8, v9-D1, v9-D2) : satisfaite sur le plan documentaire ; ne vaut pas autorisation de démarrer'
        lot1Exit: 'T-C3-1 à T-C3-14 et T-C7-1 à T-C7-6 réussis sur PostgreSQL 17 (Testcontainers) : non satisfaite'
        c3Validation: 'prononcée uniquement à la sortie du lot 1'
        feedConsumerLots: 'bloqués tant que C3 n''est pas validée (voir plan § 9)'
      stillOpen: ['C8 : durée de rétention et règle de purge, liaisons révoquées ou inactives comprises', 'encodage interne du pageToken (lot 1)']
    v10:
      date: '2026-10-28'
      approved: [Q1, Q2, Q3, Q4, Q5, Q6, Q7]
      lint: 'Redocly recommended : 0 erreur ; exception documentée no-ambiguous-paths (orderId contraint en UUID)'
    v11:
      date: '2026-10-29'
      source: 'plan § 24 (décisions des étapes 4a à 4c du lot 1)'
      approved: [v11-D1, v11-D2, v11-D3, v11-D4, v11-D5, v11-D6, v11-D7, v11-D8, v11-D9, v11-D10, v11-D11, v11-D12, v11-D13]
      contractChanges:
        - 'Product : currency retiré (v11-D6) ; imageSha256 retiré (v11-D7)'
        - '/catalog/changes : 409 CURSOR_AHEAD (v11-D2) ; 400 VALIDATION_FAILED ou INVALID_PARAMETER (v11-D3)'
        - 'ChangeEventBase : occurredAt informatif (v11-D5) ; type inconnu servi tel quel (v11-D4)'
        - 'Availability : perWarehouse exposé, périmètre calculé au service de la page (v11-D8)'
        - 'SnapshotPage : currency, productImages, availability ; limit toutes sections confondues ; objets archivés inclus (v11-D10)'
      c8Decided: ['devise (ISO 4217, en-tête de l''instantané et liaison)', 'perWarehouse']
      c8StillOpen: ['durée de rétention et règle de purge', 'durée du jeton, aud, fenêtre HMAC', 'conservation des clés d''idempotence', 'limites de lignes et de quantités', 'discountPercent', 'origine serveur, webhook, données client']
      c3Status: 'non validée : étapes 7 à 10 du lot 1 restantes'
    v12:
      date: '2026-10-29'
      source: 'plan § 25 (clôture du lot 1)'
      approved: [v12-D1, v12-D2, v12-D3, v12-D4, v12-D5, v12-D6, v12-D7]
      c3Status: 'validée (porte de sortie du Lot 1, 2026-10-29)'
      lot1: 'terminé, non déployé (backend, feat/integration-lot1, c698f75..8e79878, 22 commits)'
      lot1Exit: 'satisfaite : suite complète verte deux fois sans différence ; T-C3-1 à T-C3-14 et T-C7-1 à T-C7-6 ; 100 répétitions de T-C3-1 et de T-C3-2 b (séquenceurs, lecteurs) ; T-C3-8 à 10 lignes 0,1 %, 2,0 %, -1,6 %'
      reservation: 'P0-5 vérifiée au niveau du service seulement : critère d''entrée du lot qui crée la route HTTP'
      contractChanges:
        - 'Instantané : produit absent des sections productImages ou availability = état initial (pas d''image, version 0 ; disponibilité 0) ; dernière page possiblement vide (v12-D3)'
      httpEntryCriteria: ['P0-5 vérifiée sur la route', 'tests HTTP des codes INVALID_PAGE_TOKEN, SNAPSHOT_EXPIRED, CURSOR_AHEAD, CURSOR_EXPIRED, VALIDATION_FAILED, INVALID_PARAMETER', 'LinkRef, ChangeFilter, AckSource et WarehouseScope réels', 'publication conditionnée à une liaison active (v12-D4)', 'disponibilité republiée au changement de type de dépôt si le périmètre filtre par type']
servers:
  - url: '{geststockApiOrigin}/api/integration/v1'
    description: '[Hypothèse] Origine du backend GestStock non confirmée (décision D8).'
    variables:
      geststockApiOrigin:
        default: https://geststock-backend.invalid
        description: Placeholder volontairement invalide ; à remplacer après confirmation D8.

security:
  - linkToken: []

tags:
  - name: Autorisation
    description: "Échange du code d'autorisation (PKCE) et obtention des jetons de liaison."
  - name: Liaison
    description: "État et révocation de la liaison entre une entreprise GestStock et une boutique."
  - name: Catalogue
    description: "Flux de changements, instantané, recherche et images du catalogue lié."
  - name: Prix
    description: "Prix de référence, propositions et prix approuvés de la boutique."
  - name: Disponibilité
    description: "Disponibilité indicative sur les dépôts associés à la liaison."
  - name: Commandes
    description: "Transmission, consultation et annulation des commandes en ligne."
  - name: Réservations
    description: "Réservation de stock créée avec une commande en ligne."

paths:
  /oauth/token:
    post:
      operationId: exchangeToken
      tags: [Autorisation]
      summary: Échange de code d'autorisation ou obtention d'un jeton de liaison
      description: |
        - `grant_type=authorization_code` : échange du code à usage unique (5 min, haché en base,
          lié à l'entreprise, au client, à `redirect_uri` exacte et au défi PKCE S256). Renvoie la
          liaison créée et son secret (montré **une seule fois**).
        - `grant_type=client_credentials` : jeton de liaison court (5 min) à partir de l'identifiant et
          du secret de liaison.
        Authentification du client JeCréeMaBoutique : HTTP Basic (identifiant/secret client).
        Code rejoué, expiré, d'un autre client ou `redirect_uri` différente : `invalid_grant`, aucune liaison.
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrant'
                - $ref: '#/components/schemas/ClientCredentialsGrant'
      responses:
        '200':
          description: Jeton (et liaison, à l'échange de code)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Requête OAuth invalide (`invalid_request`, `invalid_grant`, `unsupported_grant_type`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: Client non authentifié (`invalid_client`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /link:
    get:
      operationId: getLink
      tags: [Liaison]
      summary: Statut et périmètre de la liaison appelante
      responses:
        '200':
          description: Liaison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /link/revoke:
    post:
      operationId: revokeLink
      tags: [Liaison]
      summary: Révocation définitive de la liaison à l'initiative de la boutique (décision C2)
      description: |
        Exige un jeton de liaison valide d'une liaison `ACTIVE` ou `SUSPENDED` ; aucune portée
        particulière (toute portée accordée suffit). Effets, dans une seule transaction : statut
        `REVOKED`, `revokedAt` enregistré, secret de liaison invalidé, inscription au journal d'audit
        (motif éventuel inclus). **Aucune réactivation** : une nouvelle connexion exige une nouvelle
        autorisation et crée une nouvelle liaison.

        Après révocation, toute requête de l'ancienne liaison (y compris `client_credentials`) reçoit
        `401 LINK_REVOKED`. Idempotence : si la liaison est déjà révoquée, l'appel reçoit
        `401 LINK_REVOKED` ; le client traite cette réponse **comme le succès de la révocation**, sans
        jamais réactiver la liaison.

        Réservations et commandes déjà engagées : **conservées** jusqu'à l'expiration de la réservation
        ou la conversion de la commande dans GestStock ; aucune annulation automatique.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, description: 'Motif facultatif, inscrit au journal d''audit' }
      responses:
        '200':
          description: Liaison révoquée (`status = REVOKED`, `revokedAt` renseigné)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalog/changes:
    get:
      operationId: listCatalogChanges
      tags: [Catalogue]
      summary: Flux ordonné des changements de catalogue, prix et disponibilité
      description: |
        **Séquencement (C3 validée — porte de sortie du Lot 1, 2026-10-29 ; v9-v11 : validation technique
        prévue en sortie du lot 1)** : un `seq` est
        attribué **à la lecture du flux**, sous un verrou à lecteur unique, uniquement aux événements
        dont la transaction métier est déjà validée. Un événement non validé n'est jamais exposé ; une
        transaction lente ne peut pas faire apparaître après coup un `seq` inférieur à un `seq` déjà
        servi ; l'attribution est atomique et une interruption ne perd aucun événement (le `seq`
        attribué reste acquis et l'événement est resservi au prochain appel avec le même `after`).

        Conception détaillée approuvée (P0) : écriture des événements sans `seq` ; attribution
        contiguë, dans l'ordre d'écriture, aux seuls événements validés, dans une transaction courte
        sous verrou `FOR UPDATE SKIP LOCKED` d'une ligne d'état unique. Un lecteur qui ne l'obtient
        pas sert les `seq` déjà attribués, sans attendre.

        Ordre : `seq` strictement croissant, sans trou visible pour le consommateur. `after` = dernier
        `seq` **effectivement consommé** (0 au départ) ; la page contient les événements `seq > after`
        par ordre croissant, filtrés pour la liaison.

        `lastSeq` (P1) = dernier `seq` **examiné**, y compris les événements écartés par le filtre de
        la liaison ; `after` si rien n'a été examiné. Invariants : `lastSeq ≥ after` ;
        `lastSeq ≤` dernier `seq` attribué ; une page vide avec `lastSeq > after` est normale. Le
        consommateur enregistre **toujours** `lastSeq` comme nouvel `after`.

        `hasMore` (P2) = il existe un événement de `seq > lastSeq` **ou** un événement validé encore
        sans `seq`, évalué après l'attribution. Vrai : rappeler immédiatement avec `after=lastSeq`.
        Faux : reprendre plus tard (notification ou interrogation) ; ce n'est **pas** une fin
        définitive du flux.

        `limit` (P5) : 100 par défaut, 500 au plus ; une valeur hors bornes est refusée (400
        `VALIDATION_FAILED`) ; une valeur non numérique ou `after` absent : 400 `INVALID_PARAMETER`
        (décision v11-D3).

        Livraison au moins une fois : le consommateur applique chaque événement de manière idempotente
        et ignore un événement dont la `version` est inférieure ou égale à la dernière appliquée **pour
        le même couple (`type`, `objectId`)**. Un `type` inconnu est ignoré et le curseur avance.
        GestStock sert tel qu'il est stocké un type que sa propre version ne connaît pas : un type
        inconnu ne bloque jamais le flux (décision v11-D4). L'ordre repose uniquement sur `seq` ;
        `occurredAt` est informatif (décision v11-D5).
        **Curseur en avance (décision v11-D2)** : `after` supérieur au dernier `seq` attribué (curseur
        d'une autre entreprise, flux réinitialisé) : réponse `409` avec le code `CURSOR_AHEAD`. Le
        consommateur **arrête la synchronisation et alerte**, sans resynchronisation automatique ; la
        reprise passe par la remise à zéro complète côté boutique (décision v11-D11).
        **Curseur trop ancien (décision v9-D1)** : GestStock conserve durablement un repère de purge,
        le plus haut `seq` purgé (emplacement : détail d'implémentation du lot 1). Si `after` est
        **strictement inférieur** à ce repère, des événements postérieurs à `after` ne sont plus
        disponibles : réponse `410` avec le code `CURSOR_EXPIRED`. `after` égal au repère est accepté.
        Le consommateur **abandonne ce curseur**, relance un instantané complet (`/catalog/snapshot`
        sans `pageToken`), puis reprend le flux avec `after=asOfSeq`. À ne pas confondre avec
        `410 SNAPSHOT_EXPIRED` (jeton d'instantané expiré, sur `/catalog/snapshot`) : les deux se
        distinguent par le champ `code` de `ApiError`. Durée de rétention et règle de purge : ouvertes (C8).
      x-required-scopes: [catalog:read]
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Page d'événements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
        '400':
          description: |
            Deux codes, distingués par le champ `code` de `ApiError` (décision v11-D3) :
            `VALIDATION_FAILED` : valeur hors bornes (`after` < 0, `limit` hors de 1..500), paramètre
            fautif dans `errors` ; `INVALID_PARAMETER` : `after` ou `limit` non numérique, ou `after` absent.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `code = CURSOR_AHEAD` (v11-D2) : `after` est supérieur au dernier `seq` attribué ; arrêter la
            synchronisation et alerter, sans resynchronisation automatique (remise à zéro complète côté
            boutique, décision v11-D11).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '410':
          description: |
            `code = CURSOR_EXPIRED` (v9-D1) : `after` est inférieur au repère de purge ; abandonner ce
            curseur, relancer un instantané complet, reprendre avec `after=asOfSeq`. Distinct de
            `SNAPSHOT_EXPIRED` (instantané), identifiable par `code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /catalog/changes/ack:
    post:
      operationId: acknowledgeCatalogChanges
      tags: [Catalogue]
      summary: Acquittement du curseur appliqué (condition de purge, D5)
      description: Idempotent par valeur ; un `seq` inférieur au dernier acquitté est ignoré (200).
      x-required-scopes: [catalog:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Curseur acquitté
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledgedSeq: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`seq` supérieur au dernier événement émis'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /catalog/snapshot:
    get:
      operationId: getCatalogSnapshot
      tags: [Catalogue]
      summary: Instantané paginé du catalogue lié (réconciliation, reprise)
      description: |
        Renvoie l'état courant du catalogue visible par la liaison, avec la version de chaque objet
        (décision v11-D10). **Sections, servies dans cet ordre** : `categories`, `products`,
        `productImages` (un `ProductImageState` par produit), `availability` (une `Availability` par
        produit). **Objets archivés inclus** (`active: false`) : un consommateur qui refait un instantané
        complet peut archiver ce qu'il détient encore. `limit` compte les objets **toutes sections
        confondues** ; une page peut chevaucher deux sections ; les sections vides ou terminées sont
        servies en tableaux vides. **La dernière page peut être vide** (quatre tableaux vides, sans
        `nextPageToken`) : accepté (v12-D3).
        **Produit absent de `productImages` ou `availability`** (créé pendant la pagination, après le
        passage de ces sections) : il est dans son **état initial**, pas d'image (version 0) et
        disponibilité 0 ; tout changement ultérieur arrive par le flux après `asOfSeq`. Aucun événement
        n'est publié à la création d'un produit (v12-D3).
        Versions : `@Version` de l'objet pour `categories` et `products` ; génération de l'image pour
        `productImages` (0 si le produit n'a jamais eu d'image) ; `asOfSeq` pour `availability`. Le
        consommateur applique la règle des versions à l'instantané comme au flux.
        `asOfSeq` est **fixé à la première page** (dernier `seq` attribué à cet instant) et
        **identique sur toutes les pages** de cet instantané. Un objet modifié pendant la pagination
        peut apparaître dans une version plus récente que `asOfSeq` : après la dernière page, reprendre
        le flux avec `after=asOfSeq` et appliquer la règle de version ; l'état obtenu équivaut à
        l'état source (décision C3).
      x-required-scopes: [catalog:read]
      parameters:
        - name: pageToken
          in: query
          description: |
            Absent pour la première page ; ensuite la valeur `nextPageToken` reçue. Jeton **opaque**
            (ne pas l'interpréter), **lié à la liaison** qui l'a obtenu et porteur de `asOfSeq`,
            valable **24 heures** à partir de la première page. Invalide ou émis pour une autre liaison :
            400. Expiré : 410 `SNAPSHOT_EXPIRED`, recommencer sans `pageToken`.
            Sécurité (P4) : jeton **signé** (HMAC, clé serveur dédiée par environnement), **non chiffré** ;
            il porte un identifiant de clé (`kid`) et un numéro de format. Rotation : la clé courante
            signe, la clé précédente reste acceptée en vérification pendant 24 h ; `kid` inconnu ou
            signature invalide : 400 `INVALID_PAGE_TOKEN`.
            Le client ne suppose **ni la longueur** (512 caractères au plus), **ni le format, ni le
            contenu** du jeton : il le renvoie tel quel (décision v9-D2 ; encodage interne décidé au lot 1).
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          description: Nombre maximal d'objets de la page, toutes sections confondues (v11-D10)
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Page de l'instantané
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotPage' }
        '400':
          description: '`INVALID_PAGE_TOKEN` : jeton illisible, altéré ou émis pour une autre liaison'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: '`code = SNAPSHOT_EXPIRED` : jeton de plus de 24 heures ; recommencer l''instantané sans pageToken. Distinct de CURSOR_EXPIRED (flux), identifiable par code'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /catalog/products/search:
    get:
      operationId: searchCatalogProducts
      tags: [Catalogue]
      summary: Recherche de produits GestStock pour le rapprochement assisté
      description: Aucune association n'est créée par cet appel ; le rapprochement est confirmé côté boutique.
      x-required-scopes: [catalog:match]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Candidats
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /catalog/products/{productId}/image:
    get:
      operationId: getProductImage
      tags: [Catalogue]
      summary: Image principale d'un produit lié (JPEG)
      x-required-scopes: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Image (ETag = empreinte SHA-256)
          headers:
            ETag: { schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '304': { description: Image inchangée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /prices/proposals:
    post:
      operationId: createPriceProposal
      tags: [Prix]
      summary: Proposer un prix de vente boutique (soumis à approbation, D2)
      description: |
        Crée une proposition `PROPOSED` (ou la renvoie si la clé d'idempotence a déjà servi). Tant
        qu'elle n'est pas approuvée dans GestStock (permission `integration:price-approve`), seul le
        dernier prix approuvé est commercialisable. L'approbation se fait dans GestStock, pas par
        cette API.

        **Concurrence (décision C6)** : une seule proposition `PROPOSED` par couple (liaison, produit).
        Les propositions concurrentes sont **sérialisées sur ce couple** par un verrou en base : la
        nouvelle proposition fait passer la précédente à `SUPERSEDED` dans la même transaction. La
        proposition retenue est celle qui **obtient le verrou en dernier** ; l'ordre n'est pas déduit
        d'un horodatage applicatif. L'approbation, côté GestStock, n'aboutit que si la proposition est
        encore `PROPOSED` (mise à jour conditionnée par `status = 'PROPOSED'`) ; sinon l'approbateur
        reçoit un conflit et aucun prix n'est approuvé.

        `basedOnReferenceVersion` différent de la version courante du prix de référence : refus
        `422 PRICE_VERSION_MISMATCH`, aucune proposition créée ; la boutique relit le prix de référence.
      x-required-scopes: [price:propose]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceProposalRequest' }
      responses:
        '201':
          description: Proposition enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelPrice' }
        '200':
          description: Requête rejouée — proposition déjà enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /prices:
    get:
      operationId: listPrices
      tags: [Prix]
      summary: Prix de la boutique (référence, proposé, approuvé) par produit lié
      x-required-scopes: [catalog:read]
      parameters:
        - name: productIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Prix
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /availability:
    get:
      operationId: getAvailability
      tags: [Disponibilité]
      summary: Disponibilité indicative sur les seuls dépôts associés actifs
      description: |
        `available` = stock − réservations actives (non expirées) des dépôts associés actifs ;
        par dépôt unique (défaut) le maximum d'un dépôt, en allocation multi-dépôts la somme.
        Information non garantie : seule une réservation garantit une quantité.
      x-required-scopes: [stock:read]
      parameters:
        - name: productIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Disponibilités
          content:
            application/json:
              schema:
                type: object
                properties:
                  computedAt: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Availability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /online-orders:
    post:
      operationId: createOnlineOrder
      tags: [Commandes, Réservations]
      summary: Transmettre une commande en ligne (et demander la réservation)
      description: |
        `Idempotency-Key` = identifiant de la commande JeCréeMaBoutique. Rejouer renvoie la même
        commande et la même réservation. GestStock contrôle : liaison active, produits liés,
        version de prix approuvée pour chaque ligne, dépôts associés actifs, quantités. Si la
        réservation est activée pour la liaison, elle est créée dans la même transaction
        (verrous ordonnés), avec `expiresAt` = heure serveur PostgreSQL + durée configurée
        (30 min par défaut, D3). Allocation impossible en totalité (livraison partielle
        désactivée) : commande `REJECTED_STOCK`, aucune réservation conservée.
        **Aucune vente n'est créée** : la conversion en vente se fait au point de vente par le
        personnel, avec caisse ouverte pour tout paiement.
      x-required-scopes: [orders:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineOrderRequest' }
      responses:
        '201':
          description: Commande reçue (réservée ou refusée selon le stock)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '200':
          description: Requête rejouée — commande déjà reçue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /online-orders/{orderId}:
    get:
      operationId: getOnlineOrder
      tags: [Commandes]
      summary: État d'une commande transmise
      description: Portée `orders:read` (ou `orders:write`, qui l'implique).
      x-required-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Commande
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /online-orders/external/{externalOrderId}:
    get:
      operationId: getOnlineOrderByExternalId
      tags: [Commandes]
      summary: Retrouver une commande par l'identifiant JeCréeMaBoutique (décision C4)
      description: |
        Recherche limitée à la liaison authentifiée. Le couple (liaison, `externalOrderId`) est
        unique : c'est aussi la clé d'idempotence de `POST /online-orders`, si bien que cette lecture
        renvoie la commande qu'un `POST` rejoué renverrait. Sert à la reprise après une réponse perdue
        et au rapprochement. Commande inexistante **ou** appartenant à une autre liaison : la même
        réponse 404, sans révéler l'existence d'une commande étrangère.
        Portée `orders:read` (ou `orders:write`, qui l'implique).
      x-required-scopes: [orders:read]
      parameters:
        - name: externalOrderId
          in: path
          required: true
          description: Identifiant de la commande JeCréeMaBoutique (`Order._id`)
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Commande
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /online-orders/{orderId}/cancel:
    post:
      operationId: cancelOnlineOrder
      tags: [Commandes, Réservations]
      summary: Annulation demandée par la boutique ou le client
      description: |
        Libère la réservation une seule fois (`UPDATE … WHERE status = 'RESERVED'`). Une commande
        déjà convertie en vente (`CONVERTED`) ne peut plus être annulée par cette API (retour client
        dans GestStock). Rejouer renvoie l'état final.
      x-required-scopes: [orders:write]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Commande annulée (ou déjà dans un état final compatible)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ORDER_NOT_CANCELLABLE` (déjà convertie)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }

webhooks:
  geststockChangesAvailable:
    post:
      operationId: notifyChangesAvailable
      summary: Signal « changements disponibles » envoyé par GestStock à JeCréeMaBoutique
      description: |
        Ne transporte aucune donnée de catalogue : le récepteur relit `/catalog/changes`.
        Signature : `X-GestStock-Signature: t=<epoch>,v1=<hex HMAC-SHA256(secret, t + "." + corps)>`.
        Le récepteur refuse un horodatage hors fenêtre de 5 min [Hypothèse] et ignore un
        `eventId` déjà vu. Route de réception côté JeCréeMaBoutique : à définir (D8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, linkId, latestSeq, sentAt]
              properties:
                eventId: { type: string, format: uuid }
                linkId: { type: string, format: uuid }
                latestSeq: { type: integer, format: int64 }
                sentAt: { type: string, format: date-time }
      responses:
        '204': { description: Signal pris en compte }
        '401': { description: 'Signature absente, invalide ou expirée' }

components:
  securitySchemes:
    linkToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton de liaison obtenu par `client_credentials` : `iss=geststock`,
        `aud=geststock-integration-v1` [Hypothèse], `sub`=identifiant de liaison, portées dans `scope`,
        durée 5 min [Hypothèse]. Signature, émetteur, audience, expiration vérifiés, puis statut de la
        liaison relu en base à chaque appel. Distinct des jetons utilisateurs GestStock.
        Portée exigée par opération : `x-required-scopes`. Implication (décision C5) : un jeton portant
        `orders:write` satisfait aussi `orders:read` ; aucune autre implication entre portées.
    clientBasic:
      type: http
      scheme: basic
      description: Identifiant et secret du client JeCréeMaBoutique, uniquement sur `/oauth/token`.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique par liaison et par opération ; conservée au moins 90 jours [Hypothèse alignée D5].
        Même clé avec un corps différent : `409 IDEMPOTENCY_KEY_REUSED`.
      schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        Identifiant GestStock de la commande en ligne (UUID). Contraint par `pattern` : un segment
        littéral comme `external` ne peut pas être un `orderId` valide, donc `/online-orders/{orderId}/…`
        et `/online-orders/external/{externalOrderId}` ne peuvent jamais désigner la même ressource
        (l'avertissement `no-ambiguous-paths` de Redocly est structurel et documenté comme exception).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  responses:
    BadRequest:
      description: Données invalides
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Jeton absent, invalide, expiré, ou liaison révoquée (`INVALID_TOKEN`, `LINK_REVOKED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Portée insuffisante ou liaison suspendue (`INSUFFICIENT_SCOPE`, `LINK_SUSPENDED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Objet introuvable pour cette liaison (jamais de distinction « appartient à une autre entreprise »)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    IdempotencyConflict:
      description: '`IDEMPOTENCY_KEY_REUSED` : même clé, corps différent'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BusinessRule:
      description: |
        Règle métier : `PRICE_NOT_APPROVED`, `PRICE_VERSION_MISMATCH`, `PRODUCT_NOT_LINKED`,
        `WAREHOUSE_NOT_AUTHORIZED`, `PRODUCT_ARCHIVED`.
        `PRICE_VERSION_MISMATCH` : sur une proposition de prix, `basedOnReferenceVersion` n'est plus la
        version courante du prix de référence (C6).
        Un stock insuffisant n'est pas une erreur : la commande est enregistrée à l'état
        `REJECTED_STOCK`, entièrement refusée, sans réservation conservée (plan § 5.2 règle 5, § 5.4).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Limite de débit par liaison [Hypothèse] ; `Retry-After` fourni
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    ApiError:
      description: Format d'erreur existant de GestStock (exception/ApiError, RFC 9457)
      type: object
      required: [type, title, status, code, message]
      properties:
        type: { type: string, examples: ['urn:geststock:error:insufficient-stock'] }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        details: { type: object, additionalProperties: true }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }

    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, invalid_grant, unsupported_grant_type, invalid_scope] }
        error_description: { type: string }

    AuthorizationCodeGrant:
      type: object
      required: [grant_type, code, redirect_uri, code_verifier]
      properties:
        grant_type: { type: string, const: authorization_code }
        code: { type: string, maxLength: 128 }
        redirect_uri: { type: string, format: uri, description: 'Identique, caractère pour caractère, à celle de la demande et à la liste blanche' }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }

    ClientCredentialsGrant:
      type: object
      required: [grant_type, link_id, link_secret]
      properties:
        grant_type: { type: string, const: client_credentials }
        link_id: { type: string, format: uuid }
        link_secret: { type: string, minLength: 32, maxLength: 256 }
        scope: { type: string, description: Sous-ensemble des portées accordées }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, examples: [300] }
        scope: { type: string }
        link:
          description: Présent uniquement à l'échange de code
          $ref: '#/components/schemas/Link'
        link_secret:
          type: string
          description: Présent uniquement à l'échange de code ; à chiffrer immédiatement, jamais journalisé

    Scope:
      type: string
      enum: [catalog:read, catalog:match, price:propose, stock:read, orders:read, orders:write]

    Link:
      type: object
      required: [id, status, companyCode, externalShopId, scopes, warehouses, settings, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, REVOKED] }
        companyCode: { type: string, description: 'Code public de l''entreprise (platform.company.code), jamais un nom de base' }
        externalShopId: { type: string, description: Identifiant de la boutique (User._id JeCréeMaBoutique) }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        warehouses:
          type: array
          items:
            type: object
            properties:
              warehouseId: { type: string, format: uuid }
              name: { type: string }
              active: { type: boolean }
              priority: { type: integer, minimum: 0 }
        settings:
          type: object
          properties:
            priceApproval: { type: string, enum: [REQUIRED, NOT_REQUIRED], default: REQUIRED }
            reservationEnabled: { type: boolean }
            multiWarehouseAllocation: { type: boolean, default: false }
            partialFulfilment: { type: boolean, default: false }
            reservationTtlSeconds: { type: integer, examples: [1800], description: Lecture seule ; configuré côté serveur (D3) }
        createdAt: { type: string, format: date-time }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }

    ChangePage:
      type: object
      required: [items, hasMore, lastSeq]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChangeEvent' }
        hasMore: { type: boolean, description: 'P2 : vrai s''il existe un événement de seq > lastSeq ou un événement validé sans seq (évalué après attribution) ; rappeler immédiatement. Faux : reprendre plus tard, pas une fin définitive' }
        lastSeq: { type: integer, format: int64, description: 'P1 : dernier seq examiné, filtrés compris ; after si rien n''a été examiné. lastSeq ≥ after ; toujours enregistré comme nouvel after' }

    ChangeEventBase:
      description: |
        Champs communs à tous les événements. `data` (état complet de l'objet, jamais un
        différentiel, aucune donnée personnelle) est **obligatoire pour `UPSERT`** et **facultatif pour
        `ARCHIVE`**. Ordre d'application : par couple (`type`, `objectId`), selon `version`.
        Origine de `version` : propre à chaque type (P3), précisée dans chaque variante ; toujours
        strictement croissante pour un même objet (règle R2).
      type: object
      required: [seq, type, objectId, version, operation, occurredAt]
      properties:
        seq: { type: integer, format: int64, description: 'Position dans le flux : seule clé d''ordre (v11-D5)' }
        type: { type: string, description: 'Type de l''événement ; un type inconnu du consommateur est ignoré et le curseur avance ; GestStock sert tel qu''il est stocké un type inconnu de sa propre version, sans jamais bloquer le flux (v11-D4)' }
        objectId: { type: string, format: uuid }
        version: { type: integer, format: int64, description: 'Version de l''objet ; un événement de version ≤ dernière appliquée pour le même (type, objectId) est ignoré' }
        operation: { type: string, enum: [UPSERT, ARCHIVE] }
        occurredAt: { type: string, format: date-time, description: 'Informatif : heure de début de la transaction qui a écrit l''événement. Ne sert jamais à ordonner : l''ordre repose uniquement sur seq (v11-D5)' }
        data:
          description: 'État de l''objet ; son schéma est fixé par chaque variante (discriminée par type). Obligatoire pour UPSERT, facultatif pour ARCHIVE.'
      if:
        properties:
          operation: { const: UPSERT }
      then:
        required: [data]

    ChangeEvent:
      description: |
        Un schéma par `type` (décision C7), discriminé par `type`. Une modification du prix de
        référence est publiée comme événement `PRODUCT` (champ `referencePrice`) ; il n'existe pas de
        type `REFERENCE_PRICE`. Le consommateur ignore un `type` absent de cette liste et avance son
        curseur, après l'avoir reçu selon les garanties de livraison du flux (au moins une fois, ordre
        par `seq`). Côté GestStock, un type stocké mais inconnu de la version qui sert la page est servi
        tel qu'il est stocké (`type`, `operation`, `objectId`, `version`, `data`) : il ne bloque jamais
        le flux (v11-D4).
      oneOf:
        - $ref: '#/components/schemas/CategoryChangeEvent'
        - $ref: '#/components/schemas/ProductChangeEvent'
        - $ref: '#/components/schemas/ProductImageChangeEvent'
        - $ref: '#/components/schemas/ChannelPriceChangeEvent'
        - $ref: '#/components/schemas/AvailabilityChangeEvent'
        - $ref: '#/components/schemas/OnlineOrderStatusChangeEvent'
      discriminator:
        propertyName: type
        mapping:
          CATEGORY: '#/components/schemas/CategoryChangeEvent'
          PRODUCT: '#/components/schemas/ProductChangeEvent'
          PRODUCT_IMAGE: '#/components/schemas/ProductImageChangeEvent'
          CHANNEL_PRICE: '#/components/schemas/ChannelPriceChangeEvent'
          AVAILABILITY: '#/components/schemas/AvailabilityChangeEvent'
          ONLINE_ORDER_STATUS: '#/components/schemas/OnlineOrderStatusChangeEvent'

    CategoryChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`version` (P3, entité jamais supprimée physiquement) : `@Version` de la catégorie, lu après flush dans la transaction qui l''a modifiée (R1) ; `data` = état écrit dans cette transaction.'
          properties:
            type: { const: CATEGORY }
            data: { $ref: '#/components/schemas/Category' }

    ProductChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: 'Inclut les changements du prix de référence (`Product.referencePrice`). `version` (P3, entité jamais supprimée physiquement) : `@Version` du produit, lu après flush (R1) ; `data` = état écrit dans la transaction.'
          properties:
            type: { const: PRODUCT }
            data: { $ref: '#/components/schemas/Product' }

    ProductImageChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`objectId` = identifiant du produit (au plus une image par produit). `version` (P3, objet supprimable) : génération durable `product_image_generation` (P7), voir ProductImageState.'
          properties:
            type: { const: PRODUCT_IMAGE }
            data: { $ref: '#/components/schemas/ProductImageState' }

    ChannelPriceChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`version` : origine **à confirmer** (P3 — famille non décidée, lots 3-4, à la lecture du modèle `channel_price`).'
          properties:
            type: { const: CHANNEL_PRICE }
            data: { $ref: '#/components/schemas/ChannelPrice' }

    AvailabilityChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: |
            Événement **mince** (P3, agrégat calculé) : `version` = `seq` de l'événement. L'événement ne
            fige pas de valeur à l'écriture : `data` est **recalculé au moment de servir la page**, depuis
            les données validées. Plusieurs événements du même produit dans une page peuvent être
            fusionnés en un seul (le plus grand `seq`). Raison : deux transactions concurrentes tenant
            des verrous différents (par exemple deux ventes du même produit dans deux dépôts) peuvent
            chacune calculer un agrégat qui ignore l'autre ; une valeur figée à l'écriture pourrait être
            fausse.
          properties:
            type: { const: AVAILABILITY }
            data: { $ref: '#/components/schemas/Availability' }

    OnlineOrderStatusChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`version` : origine **à confirmer** (P3 — famille non décidée, lots 3-4, à la lecture du modèle des commandes en ligne).'
          properties:
            type: { const: ONLINE_ORDER_STATUS }
            data: { $ref: '#/components/schemas/OnlineOrderStatus' }

    ProductImageState:
      description: |
        État de l'image principale d'un produit (décision C7). `imageSha256` nul : le produit n'a plus
        d'image ; sinon, relire `/catalog/products/{productId}/image` si l'empreinte a changé.
        `version` (P7) = génération lue dans `product_image_generation` : compteur par produit, jamais
        supprimé avec l'image, incrémenté par la première instruction de la transaction d'image
        (`INSERT … ON CONFLICT … RETURNING`), dans la même transaction que l'image et l'événement ;
        strictement croissant, y compris après suppression puis ajout ou en cas de concurrence.
        Retrait d'une image : événement `UPSERT` avec `imageSha256 = null` et une génération incrémentée.
        P6 : image renvoyée avec une empreinte inchangée, ou suppression d'une image inexistante : ni
        incrément, ni événement. Dans l'instantané (section `productImages`, v11-D10) : un état par
        produit, `version` = 0 si le produit n'a jamais eu d'image (aucune génération), `imageSha256` nul
        si aucune image. Seule source de l'état de l'image : `Product` ne porte plus `imageSha256` (v11-D7).
        *(v7 : point bloquant « source de version » — résolu sur le plan documentaire par P7 ;
        implémentation et tests au lot 1.)*
      type: object
      required: [productId, imageSha256, version]
      properties:
        productId: { type: string, format: uuid }
        imageSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        version: { type: integer, format: int64 }

    SnapshotPage:
      description: |
        Page de l'instantané (décision v11-D10). En-tête : `asOfSeq`, `currency`, `nextPageToken`.
        Sections, dans cet ordre : `categories`, `products`, `productImages`, `availability` ; `limit`
        compte les objets toutes sections confondues, une page peut chevaucher deux sections, une section
        sans objet dans la page est un tableau vide. Objets archivés inclus (`active: false`) ; les
        sections `productImages` et `availability` couvrent tous les produits, archivés compris ; un
        produit absent de ces sections (créé pendant la pagination) est dans son état initial : pas
        d'image (version 0), disponibilité 0. La dernière page peut être vide, sans `nextPageToken`
        (v12-D3).
        *(v10 : sections `categories` et `products` seulement, `nextPageToken` nul sur la dernière page,
        devise portée par chaque `Product` — remplacé.)*
      type: object
      required: [asOfSeq, currency, categories, products, productImages, availability]
      properties:
        asOfSeq: { type: integer, format: int64, description: 'Fixé à la première page, identique sur toutes les pages ; reprendre le flux avec `after=asOfSeq`' }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [XOF]
          description: 'Devise de l''entreprise, code ISO 4217, normalisée depuis platform.company.currency (FCFA, F CFA, XOF → XOF) ; une seule fois par page, jamais par produit (v11-D6)'
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        productImages:
          type: array
          description: 'Un état par produit, archivés compris : version = génération de l''image, 0 si le produit n''a jamais eu d''image ; imageSha256 nul si aucune image'
          items: { $ref: '#/components/schemas/ProductImageState' }
        availability:
          type: array
          description: 'Une disponibilité par produit, archivés compris ; version de chaque entrée = asOfSeq de l''en-tête (aucun champ version dans Availability)'
          items: { $ref: '#/components/schemas/Availability' }
        nextPageToken: { type: string, maxLength: 512, description: 'Opaque, lié à la liaison, valable 24 h depuis la première page ; **absent** sur la dernière page. Longueur, format et contenu non garantis (v9-D2) : renvoyer tel quel' }

    Category:
      type: object
      required: [id, name, active, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 255 }
        active: { type: boolean }
        version: { type: integer, format: int64 }

    Product:
      description: |
        Champs détenus par GestStock ; le prix d'achat n'est jamais exposé. La devise n'est pas portée
        par le produit : elle est exposée une seule fois, sur la liaison (lot 2) et dans l'en-tête de
        l'instantané (v11-D6). L'état de l'image passe uniquement par `PRODUCT_IMAGE` (v11-D7).
        *(v10 : `currency` et `imageSha256` dans `Product` — retirés en v11.)*
      type: object
      required: [id, sku, name, categoryId, unit, referencePrice, active, version]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        categoryId: { type: string, format: uuid }
        unit: { type: string, enum: [UNIT, PAIR, BOX, BOTTLE] }
        referencePrice: { type: string, description: 'Prix de détail GestStock, décimal en chaîne (ex. "6000.00")' }
        active: { type: boolean }
        version: { type: integer, format: int64 }

    PriceProposalRequest:
      type: object
      required: [productId, price, currency, basedOnReferenceVersion]
      properties:
        productId: { type: string, format: uuid }
        price: { type: string, description: 'Décimal en chaîne, > 0, 2 décimales au plus' }
        currency: { type: string }
        basedOnReferenceVersion: { type: integer, format: int64, description: Version du prix de référence vue par le commerçant }
        note: { type: string, maxLength: 500 }

    ChannelPrice:
      type: object
      required: [productId, referencePrice, referenceVersion]
      properties:
        productId: { type: string, format: uuid }
        referencePrice: { type: string }
        referenceVersion: { type: integer, format: int64 }
        approved:
          description: Seul prix commercialisable ; absent si aucun prix approuvé
          type: [object, 'null']
          properties:
            price: { type: string }
            currency: { type: string }
            priceVersion: { type: integer, format: int64 }
            approvedAt: { type: string, format: date-time }
        pending:
          type: [object, 'null']
          properties:
            proposalId: { type: string, format: uuid }
            price: { type: string }
            status: { type: string, enum: [PROPOSED, APPROVED, REJECTED, WITHDRAWN, SUPERSEDED] }
            rejectionReason: { type: [string, 'null'] }
        referenceChangedSinceApproval: { type: boolean }

    Availability:
      description: |
        Disponibilité d'un produit, calculée au moment de servir la page (événement mince
        `AVAILABILITY`, P3 ; section `availability` de l'instantané) : stock des dépôts du périmètre moins
        les réservations, jamais négative. **`perWarehouse` exposé** (C8 tranché sur ce point, v11-D8) :
        détail par dépôt du périmètre ; un dépôt absent vaut 0 ; `available` = somme du détail.
        Périmètre calculé au moment de servir la page : au lot 2, dépôts vendables choisis par liaison et
        figés à l'autorisation (par défaut les dépôts `STORE` seulement, `WAREHOUSE` sur option explicite
        du commerçant) ; si l'utilisateur qui a autorisé la liaison perd ses droits, la liaison passe « à
        revoir » avec une alerte, sans changement silencieux du périmètre.
      type: object
      required: [productId, available, computedAt]
      properties:
        productId: { type: string, format: uuid }
        available: { type: integer, minimum: 0 }
        perWarehouse:
          type: array
          items:
            type: object
            required: [warehouseId, available]
            properties:
              warehouseId: { type: string, format: uuid }
              available: { type: integer, minimum: 0 }
        computedAt: { type: string, format: date-time }

    OnlineOrderRequest:
      description: Instantané commercial figé à la commande ; les prix sont vérifiés, jamais crus
      type: object
      required: [externalOrderId, createdAt, currency, lines]
      properties:
        externalOrderId: { type: string, maxLength: 64, description: Order._id JeCréeMaBoutique }
        createdAt: { type: string, format: date-time }
        currency: { type: string }
        customer:
          description: Données personnelles minimales, conservation selon D11
          type: object
          properties:
            name: { type: string, maxLength: 200 }
            phone: { type: string, maxLength: 30 }
        delivery:
          type: object
          properties:
            mode: { type: string, enum: [delivery, pickup] }
            address: { type: string, maxLength: 500 }
        note: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productId, quantity, unitPrice, priceVersion]
            properties:
              productId: { type: string, format: uuid }
              sku: { type: string }
              label: { type: string, maxLength: 200 }
              quantity: { type: integer, minimum: 1, maximum: 100000 }
              unitPrice: { type: string, description: Doit égaler le prix approuvé de `priceVersion` }
              discountPercent: { type: string, description: 'Remise éventuelle, plafonnée par GestStock' }
              priceVersion: { type: integer, format: int64 }

    OnlineOrderStatus:
      type: object
      required: [orderId, externalOrderId, status]
      properties:
        orderId: { type: string, format: uuid }
        externalOrderId: { type: string }
        status:
          type: string
          enum: [RECEIVED, CHECKED, REJECTED, RESERVED, REJECTED_STOCK, ACCEPTED, REFUSED, IN_PREPARATION, CONVERTED, CANCELLED, EXPIRED]
        reason: { type: [string, 'null'] }

    OnlineOrder:
      allOf:
        - $ref: '#/components/schemas/OnlineOrderStatus'
        - type: object
          properties:
            reservation:
              type: [object, 'null']
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [RESERVED, CONSUMED, CANCELLED, RELEASED, EXPIRED] }
                expiresAt: { type: string, format: date-time, description: Heure serveur PostgreSQL de création + durée configurée }
                allocations:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string, format: uuid }
                      warehouseId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
            saleIds:
              type: array
              description: Ventes créées au point de vente (une par dépôt si D4 retenue)
              items: { type: string, format: uuid }
