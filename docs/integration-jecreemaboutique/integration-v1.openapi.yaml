    v14:
      date: '2026-10-29'
      source: 'plan § 27 (décisions du lot 2)'
      approved: [v14-D1, v14-D2, v14-D3, v14-D4, v14-D5, v14-D6, v14-D7, v14-D8, v14-D9, v14-D10, v14-D11, v14-D12, v14-D13, v14-D14, v14-D15, v14-D16, v14-D17, v14-D18]
      linkFlow: 'PAR serveur à serveur (POST /oauth/par, Basic du client, request_uri à usage unique, 10 min) ; consentement sur le frontend GestStock (integration:manage) ; retour sur une page Angular JeCréeMaBoutique protégée, puis échange du code par le backend JeCréeMaBoutique (PKCE S256)'
      uniqueness: 'une boutique liée à une seule entreprise à la fois (liaisons non révoquées) ; une entreprise peut avoir plusieurs boutiques'
      credentials: 'client JeCréeMaBoutique par environnement (HTTP Basic) et secret par liaison ; secret haché SHA-256, comparaison en temps constant'
      token: 'iss geststock-integration ; claim typ integration ; en-tête typ at+jwt (RFC 9068) ; aud geststock-integration ; 15 min'
      rotation: 'POST /link/secret avec le jeton de la liaison ; ancien secret valide jusqu''au premier usage du nouveau, 24 h au plus'
      suspension: 'SUSPENDED avec motif MANUAL ou AUTHORIZER_LOST_ACCESS ; 403 LINK_SUSPENDED sauf GET /link et POST /link/revoke ; publication maintenue'
      replayedCode: 'refusé (invalid_grant) ; la liaison créée par ce code est révoquée'
      contractChanges:
        - 'POST /oauth/par ajouté (PushedAuthorizationRequest, PushedAuthorizationResponse)'
        - '/oauth/token : Basic du client exigé pour les deux grants ; authorization_code avec PKCE S256 et redirect_uri identique à celle de la demande ; code rejoué'
        - 'POST /link/secret ajouté (LinkSecretResponse)'
        - 'linkToken : iss, typ, hachage du secret, rotation ; clientBasic : client par environnement'
        - 'Link : statut PENDING décrit, suspensionReason ; Forbidden : LINK_SUSPENDED décrit'
      adjustments:
        - 'request_uri valable 10 min, comme le state JeCréeMaBoutique (première rédaction : environ 90 s)'
        - 'limites de débit (v13-D4 complété) : /oauth/par 30/min par client ; /link/secret 5/h par liaison ; 429 avec Retry-After, 503 si les compteurs sont indisponibles'
        - 'Link.currency (ISO 4217, v11-D6)'
        - 'liaisons PENDING au code expiré révoquées (revocationReason EXPIRED) au dépôt d''une nouvelle demande pour la même boutique, avant le contrôle d''unicité ; nettoyage global au lot 3'
        - 'Link.revocationReason : SHOP_REQUEST, GESTSTOCK_ADMIN, CODE_REPLAYED, EXPIRED ; nul seulement tant que la liaison n''est pas révoquée ; le consommateur tolère une valeur inconnue (évolution sans rupture)'
        - 'secret compromis : révocation puis nouvelle liaison, pas la rotation'
