        - 'E2 : corps de POST /catalog/changes/ack limité à 1 024 octets, au-delà 413 CONTENT_TOO_LARGE (RFC 9110 § 15.5.14)'
        - 'E3 : max-duration nulle : le premier lot de purge a toujours lieu'
