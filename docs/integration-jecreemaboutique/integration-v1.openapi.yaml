    v17:
      date: '2026-11-02'
      source: 'plan § 30 (acquittement du flux et purge, conception G17), révisé après revue contradictoire'
      approved: [v17-D1, v17-D2, v17-D3, v17-D4, v17-D5, v17-D6, v17-D7, v17-D8, v17-D9, v17-D10, v17-D11, v17-D12, v17-D13, v17-D14, v17-D15, v17-D16]
