paths:
  /oauth/par:
    post:
      operationId: pushAuthorizationRequest
      tags: [Autorisation]
      summary: Dépôt de la demande d'autorisation de serveur à serveur (PAR, RFC 9126)
      description: |
        Première étape du parcours de liaison (v14-D1). Le backend JeCréeMaBoutique, authentifié comme
        **client** (HTTP Basic, v14-D3), dépose la demande : boutique à lier, `redirect_uri`, défi PKCE,
        portées et `state`. Il reçoit un `request_uri` **à usage unique**, valable **10 min**, comme le
        `state` de JeCréeMaBoutique : la personne GestStock doit pouvoir se connecter. Il reste lié au
        client et inutilisable sans le vérificateur PKCE, conservé par le backend JeCréeMaBoutique.
        *(Première rédaction v14 : environ 90 s.)*
        Le navigateur ne transporte ensuite que `client_id` et `request_uri` vers l'écran d'autorisation
        du frontend GestStock (`/integrations/jecreemaboutique/authorize`) : **aucun paramètre lu dans
        l'URL du navigateur** n'est pris en compte. L'écran affiche la boutique telle que déposée ici.

        Règles :
        - Corps `application/x-www-form-urlencoded` seulement ; **aucun paramètre dans l'URL** ; chaque
          paramètre **une seule fois** (RFC 6749 § 3.2) ; sinon `invalid_request`. Un nom de paramètre
          inconnu n'est jamais repris dans un message d'erreur (v15).
        - Caractère de contrôle (U+0000 à U+001F, U+007F) dans un nom ou une valeur, tabulation et
          sauts de ligne compris : `invalid_request`, avant tout traitement, rien n'est enregistré (v15).
        - `redirect_uri` : **comparaison exacte** avec la liste blanche du client pour l'environnement
          (v14-D12 ; `localhost` seulement en développement et en essai).
        - `code_challenge_method` : `S256` uniquement.
        - `scope` : portées séparées par des espaces, au moins une, toutes autorisées pour le client ;
          sinon `invalid_scope`.
        - Liaisons en attente expirées : dans la même transaction et **avant** le contrôle d'unicité,
          les liaisons `PENDING` de la même boutique dont le code a expiré passent à `REVOKED`
          (`revocationReason = EXPIRED`) ; de même, à l'approbation, avant la création de la nouvelle
          liaison en attente. Le nettoyage global arrive au lot 3 (cron).
        - Unicité (v14-D2) : une boutique déjà liée par une liaison non révoquée de ce client est
          refusée (`invalid_request`) ; un index unique partiel en base reste la garantie finale.
        - Limite de débit (v13-D4 complété en v14 et v15) : **30 requêtes par minute par IP**, avant
          l'authentification du client (toutes tentatives comprises), et **30 par minute par client**,
          après une authentification réussie seulement (valeurs de départ, configurables) ;
          dépassement : `429` avec `Retry-After`.
        - Éligibilité de la boutique (v14-D13) : le backend JeCréeMaBoutique ne dépose une demande que
          pour une boutique approuvée et non bannie, à la demande de son propriétaire (jamais du rôle
          `admin` de JeCréeMaBoutique) ; GestStock ne peut pas le vérifier.

        Après consentement d'une personne GestStock disposant de `integration:manage`, le navigateur
        est redirigé vers `redirect_uri?code=…&state=…&iss=geststock-integration` ; refus :
        `redirect_uri?error=access_denied&state=…&iss=geststock-integration`. `iss` (RFC 9207) vaut
        l'identifiant **fixe** `geststock-integration`, le même que l'émetteur des jetons de liaison, et
        non une URL d'émetteur comme le prévoit la RFC 9207 : **écart assumé** (v15) ; le backend
        JeCréeMaBoutique le compare à l'identique. Le `request_uri` ne sert qu'à **une** décision
        (approbation ou refus).
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PushedAuthorizationRequest' }
      responses:
        '201':
          description: Demande enregistrée
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushedAuthorizationResponse' }
        '400':
          description: |
            Demande invalide (`invalid_request`, `invalid_scope`) : paramètre absent, répété, dans l'URL
            ou contenant un caractère de contrôle ; `redirect_uri` hors liste blanche ; boutique déjà
            liée. Requête refusée par le pare-feu HTTP avant la route : `400` sans corps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: Client non authentifié ou en-tête `Authorization` illisible (`invalid_client`, en-tête `WWW-Authenticate` Basic)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Plus de 30 requêtes par minute pour l'IP ou pour le client (v13-D4 complété en v14 et v15 ; valeurs de départ, configurables)
        '503': { $ref: '#/components/responses/RateLimitUnavailable' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }

  /oauth/token:
    post:
      operationId: exchangeToken
      tags: [Autorisation]
      summary: Échange de code d'autorisation ou obtention d'un jeton de liaison
      description: |
        Authentification du **client** JeCréeMaBoutique (HTTP Basic) exigée pour les deux grants
        (v14-D3).
        - `grant_type=authorization_code` : échange du code à usage unique (5 min, haché en base,
          lié à l'entreprise, au client, à la demande déposée par `/oauth/par`, à sa `redirect_uri`
          exacte et au défi PKCE **S256** : `code_verifier` obligatoire). Active la liaison créée à
          l'approbation (`PENDING` → `ACTIVE`) et renvoie la liaison et son secret (montré **une seule
          fois**). **Code rejoué** (v14-D14) : `invalid_grant`, et la liaison créée par ce code est
          **révoquée**.
        - `grant_type=client_credentials` : jeton de liaison de **15 min** (v13-D5) à partir de
          l'identifiant et du secret de liaison. Pendant une rotation, l'ancien et le nouveau secret sont
          tous deux acceptés jusqu'au premier usage du nouveau, 24 h au plus (v14-D6). Liaison
          suspendue : jeton émis (seuls `GET /link` et `POST /link/revoke` répondront). Liaison
          **révoquée** : `400 invalid_grant` avec **`code = LINK_REVOKED`** (v15) ; liaison inconnue ou
          d'un autre client, secret faux : `invalid_grant` sans `code`. `scope` facultatif : sous-ensemble
          non vide des portées de la liaison, sinon `invalid_scope`.
        Code expiré, d'un autre client, `redirect_uri` différente ou `code_verifier` faux :
        `invalid_grant` **sans `code`**, aucune liaison activée ; une `redirect_uri` différente ou un
        `code_verifier` faux laissent le code utilisable avec les bons paramètres.
        Drapeau de publication de l'entreprise non posé (base de l'entreprise verrouillée au-delà de
        2 s, v15) : `503 temporarily_unavailable`, **code non consommé** ; réessayer avec le même code.
        Corps de formulaire seulement, sans paramètre dans l'URL ni paramètre répété ; caractère de
        contrôle dans un nom ou une valeur : `invalid_request` (v15).
        Limite de débit (C1, v13-D4, v15) : **10 requêtes par minute par IP**, avant l'authentification
        du client (toutes tentatives comprises), et **10 par minute par client**, après une
        authentification réussie seulement (valeurs de départ, configurables) ; dépassement : `429` avec
        `Retry-After`.
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrant'
                - $ref: '#/components/schemas/ClientCredentialsGrant'
      responses:
        '200':
          description: Jeton (et liaison, à l'échange de code)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: |
            Requête OAuth invalide (`invalid_request`, `invalid_grant`, `invalid_scope`,
            `unsupported_grant_type`) ; liaison révoquée (`client_credentials`) : `invalid_grant` avec
            `code = LINK_REVOKED`. Requête refusée par le pare-feu HTTP avant la route : `400` sans corps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: Client non authentifié ou en-tête `Authorization` illisible (`invalid_client`, en-tête `WWW-Authenticate` Basic)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: |
            Deux cas, deux formats (v15) :
            - `RATE_LIMIT_UNAVAILABLE` (`ApiError`, `application/problem+json`) : compteurs de débit
              inaccessibles, requête refusée (C1, v13-D4) ;
            - `temporarily_unavailable` (`OAuthError`, `application/json`) : échange du code impossible
              pour l'instant (drapeau de publication non posé) ; **code non consommé**, réessai sûr.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }

  /link:
    get:
      operationId: getLink
      tags: [Liaison]
      summary: Statut et périmètre de la liaison appelante
      description: |
        Accessible aussi pour une liaison `SUSPENDED` (v14-D10), afin d'en lire le motif. Lit les dépôts
        dans la base de l'entreprise : contrôles d'entreprise (`403 COMPANY_SUSPENDED`,
        `COMPANY_UNAVAILABLE`) et de migration (`503 SCHEMA_UPGRADE_IN_PROGRESS`,
        `SCHEMA_UPGRADE_FAILED`). Portées effectives (portées du jeton ∩ portées de la liaison en base).
      responses:
        '200':
          description: Liaison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400': { $ref: '#/components/responses/FirewallRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`SCHEMA_UPGRADE_IN_PROGRESS`, `SCHEMA_UPGRADE_FAILED` ou `SERVICE_CAPACITY_REACHED` (lecture des dépôts dans la base de l''entreprise) ; jamais `RATE_LIMIT_UNAVAILABLE` (route non limitée en débit)'

  /link/revoke:
    post:
      operationId: revokeLink
      tags: [Liaison]
      summary: Révocation définitive de la liaison à l'initiative de la boutique (décision C2)
      description: |
        Exige un jeton de liaison valide d'une liaison `ACTIVE` ou `SUSPENDED` ; aucune portée
        particulière (toute portée accordée suffit). Effets, dans une seule transaction : statut
        `REVOKED`, `revokedAt` enregistré, secret de liaison invalidé, inscription au journal d'audit
        (motif éventuel inclus). **Aucune réactivation** : une nouvelle connexion exige une nouvelle
        autorisation et crée une nouvelle liaison.

        Après révocation, toute requête de l'ancienne liaison avec un jeton reçoit `401 LINK_REVOKED` ;
        `client_credentials` reçoit `400 invalid_grant` avec `code = LINK_REVOKED` (v15).
        Idempotence : si la liaison est déjà révoquée, l'appel reçoit `401 LINK_REVOKED` ; le client
        traite cette réponse **comme le succès de la révocation**, sans jamais réactiver la liaison.

        Ne touche que la base plateforme : servie même si l'entreprise est suspendue, indisponible ou en
        migration (aucun `403 COMPANY_*` ni `503 SCHEMA_UPGRADE_*`), et pendant une suspension de la
        liaison. Réponse : la liaison, `revocationReason = SHOP_REQUEST`, **`warehouses` vide** (une
        liaison révoquée ne vend plus aucun dépôt).

        Corps **facultatif** (sans corps : aucun motif). `reason` : texte libre de 500 caractères au
        plus, réservé au journal d'audit (jamais renvoyé ni journalisé ailleurs) ; tabulation et sauts de
        ligne permis, autres caractères de contrôle refusés (v15).

        Réservations et commandes déjà engagées : **conservées** jusqu'à l'expiration de la réservation
        ou la conversion de la commande dans GestStock ; aucune annulation automatique.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: |
                    Motif facultatif, inscrit tel quel au journal d'audit. Tabulation (U+0009), saut de
                    ligne (U+000A) et retour chariot (U+000D) permis ; tout autre caractère de contrôle
                    (U+0000 à U+001F, U+007F) : `400 VALIDATION_FAILED`.
      responses:
        '200':
          description: Liaison révoquée (`status = REVOKED`, `revokedAt` renseigné, `revocationReason = SHOP_REQUEST`, `warehouses` vide)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: |
            `VALIDATION_FAILED` : motif de plus de 500 caractères ou caractère de contrôle refusé ;
            `MALFORMED_REQUEST` : corps JSON illisible. Aucune révocation ni audit. Requête refusée par
            le pare-feu HTTP avant la route : `400` sans corps.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `INSUFFICIENT_SCOPE` seulement : jeton sans aucune portée effective (portées du jeton ∩ portées
            de la liaison en base). Jamais `LINK_SUSPENDED` (révocation permise pendant une suspension)
            ni `COMPANY_*` (base plateforme seulement).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE` : corps présent dans un autre format que `application/json`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /link/secret:
    post:
      operationId: rotateLinkSecret
      tags: [Liaison]
      summary: Rotation du secret de liaison, de serveur à serveur (v14-D6)
      description: |
        Exige un jeton de liaison valide d'une liaison `ACTIVE` ; aucune portée particulière. Liaison
        `SUSPENDED` : `403 LINK_SUSPENDED` (v14-D10).

        Émet un **nouveau secret**, renvoyé **une seule fois** dans la réponse (jamais affiché à une
        personne) ; GestStock n'en conserve que l'empreinte SHA-256. L'**ancien secret reste accepté**
        par `client_credentials` jusqu'au **premier usage du nouveau**, et **24 h au plus** ; il est
        ensuite refusé. Les jetons déjà émis restent valables jusqu'à leur expiration.

        Pas d'en-tête `Idempotency-Key` : rejouer la réponse obligerait à conserver le secret en clair.
        Si la réponse est perdue, le client garde l'ancien secret, encore valide, et rappelle cette
        route : le nouvel appel **remplace** le secret en attente, qui n'est plus accepté.
        Chaque rotation est inscrite au journal d'audit.
        Limite de débit (v13-D4 complété en v14) : **5 rotations par heure et par liaison** (valeur de
        départ, configurable).
        La rotation n'est **pas** la réponse à un secret compromis : dans ce cas, révoquer la liaison
        (`POST /link/revoke`) puis en créer une nouvelle (v14-D6).
      responses:
        '200':
          description: Nouveau secret de liaison
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkSecretResponse' }
        '400': { $ref: '#/components/responses/FirewallRejected' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Plus de 5 rotations par heure pour la liaison (v13-D4 complété en v14 ; valeur de départ, configurable)
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`RATE_LIMIT_UNAVAILABLE` (compteur des rotations inaccessible), `SCHEMA_UPGRADE_IN_PROGRESS` ou `SCHEMA_UPGRADE_FAILED`'

  /catalog/changes:
    get:
      operationId: listCatalogChanges
      tags: [Catalogue]
      summary: Flux ordonné des changements de catalogue, prix et disponibilité
      description: |
        **Séquencement (C3 validée — porte de sortie du Lot 1, 2026-10-29 ; v9-v11 : validation technique
        prévue en sortie du lot 1)** : un `seq` est
        attribué **à la lecture du flux**, sous un verrou à lecteur unique, uniquement aux événements
        dont la transaction métier est déjà validée. Un événement non validé n'est jamais exposé ; une
        transaction lente ne peut pas faire apparaître après coup un `seq` inférieur à un `seq` déjà
        servi ; l'attribution est atomique et une interruption ne perd aucun événement (le `seq`
        attribué reste acquis et l'événement est resservi au prochain appel avec le même `after`).

        Conception détaillée approuvée (P0) : écriture des événements sans `seq` ; attribution
        contiguë, dans l'ordre d'écriture, aux seuls événements validés, dans une transaction courte
        sous verrou `FOR UPDATE SKIP LOCKED` d'une ligne d'état unique. Un lecteur qui ne l'obtient
        pas sert les `seq` déjà attribués, sans attendre.

        Ordre : `seq` strictement croissant, sans trou visible pour le consommateur. `after` = dernier
        `seq` **effectivement consommé** (0 au départ) ; la page contient les événements `seq > after`
        par ordre croissant, filtrés pour la liaison.

        `lastSeq` (P1) = dernier `seq` **examiné**, y compris les événements écartés par le filtre de
        la liaison ; `after` si rien n'a été examiné. Invariants : `lastSeq ≥ after` ;
        `lastSeq ≤` dernier `seq` attribué ; une page vide avec `lastSeq > after` est normale. Le
        consommateur enregistre **toujours** `lastSeq` comme nouvel `after`.

        `hasMore` (P2) = il existe un événement de `seq > lastSeq` **ou** un événement validé encore
        sans `seq`, évalué après l'attribution. Vrai : rappeler immédiatement avec `after=lastSeq`.
        Faux : reprendre plus tard (interrogation périodique, v13-D3) ; ce n'est **pas** une fin
        définitive du flux.

        `limit` (P5) : 100 par défaut, 500 au plus ; une valeur hors bornes est refusée (400
        `VALIDATION_FAILED`) ; une valeur non numérique ou `after` absent : 400 `INVALID_PARAMETER`
        (décision v11-D3). Format accepté (G16) : entier décimal, signe `+` ou `-` facultatif, sans espace
        ni décimale ; chaque paramètre au plus une fois. Les autres paramètres de la query sont ignorés.

        **Portée et filtre (G16, revue du 2026-11-02)** : portée `catalog:read` ; catalogue actif entier
        de l'entreprise (Q2), sans sélection de produits par liaison. Les événements `AVAILABILITY`
        (quantités par dépôt) ne sont servis qu'aux liaisons qui ont **aussi** `stock:read`, la portée de
        `GET /availability` ; sans elle, ils sont écartés par le filtre de la liaison, examinés quand même
        (`lastSeq` avance, P1). Tous les autres types, connus ou non, sont servis.

        Réponses : `Cache-Control: no-store` (chaîne d'intégration). `HEAD` est servi implicitement comme
        `GET`, sans corps : il compte dans la limite de débit et attribue les `seq` comme un `GET`.

        Livraison au moins une fois : le consommateur applique chaque événement de manière idempotente
        et ignore un événement dont la `version` est inférieure ou égale à la dernière appliquée **pour
        le même couple (`type`, `objectId`)**. Un `type` inconnu est ignoré et le curseur avance.
        GestStock sert tel qu'il est stocké un type que sa propre version ne connaît pas : un type
        inconnu ne bloque jamais le flux (décision v11-D4). L'ordre repose uniquement sur `seq` ;
        `occurredAt` est informatif (décision v11-D5).
        **Curseur en avance (décision v11-D2)** : `after` supérieur au dernier `seq` attribué (curseur
        d'une autre entreprise, flux réinitialisé) : réponse `409` avec le code `CURSOR_AHEAD`. Le
        consommateur **arrête la synchronisation et alerte**, sans resynchronisation automatique ; la
        reprise passe par la remise à zéro complète côté boutique (décision v11-D11).
        **Curseur trop ancien (décision v9-D1)** : GestStock conserve durablement un repère de purge,
        le plus haut `seq` purgé (emplacement : détail d'implémentation du lot 1). Si `after` est
        **strictement inférieur** à ce repère, des événements postérieurs à `after` ne sont plus
        disponibles : réponse `410` avec le code `CURSOR_EXPIRED`. `after` égal au repère est accepté.
        Le consommateur **abandonne ce curseur**, relance un instantané complet (`/catalog/snapshot`
        sans `pageToken`), puis reprend le flux avec `after=asOfSeq`. À ne pas confondre avec
        `410 SNAPSHOT_EXPIRED` (jeton d'instantané expiré, sur `/catalog/snapshot`) : les deux se
        distinguent par le champ `code` de `ApiError`. Rétention et règle de purge : D5 (90 jours au moins,
        acquittement de toutes les liaisons actives ou suspendues) et plan § 30.4 (relevé v17) ; purge
        désactivée par défaut.
      x-required-scopes: [catalog:read]
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Page d'événements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
        '400':
          description: |
            Deux codes, distingués par le champ `code` de `ApiError` (décision v11-D3) :
            `VALIDATION_FAILED` : valeur hors bornes (`after` < 0, `limit` hors de 1..500), paramètre
            fautif dans `errors` ; `INVALID_PARAMETER` : `after` absent ; `after` ou `limit` vide, non
            entier ou hors de l'intervalle d'un entier 64 bits (« Paramètre invalide : … ») ; répété
            (« Paramètre répété : … ») ; nom ou valeur refusés par le pare-feu HTTP à la lecture
            (« Paramètre refusé. »). Le message nomme le paramètre, jamais la valeur reçue ; aucune
            valeur dans les journaux. Une requête refusée par le pare-feu avant toute route (`%00` dans le
            chemin, caractère de contrôle dans un en-tête) reçoit un `400` **sans corps**
            (`FirewallRejected`, v15-D2).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '409':
          description: |
            `code = CURSOR_AHEAD` (v11-D2) : `after` est supérieur au dernier `seq` attribué ; arrêter la
            synchronisation et alerter, sans resynchronisation automatique (remise à zéro complète côté
            boutique, décision v11-D11).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '410':
          description: |
            `code = CURSOR_EXPIRED` (v9-D1) : `after` est inférieur au repère de purge ; abandonner ce
            curseur, relancer un instantané complet, reprendre avec `after=asOfSeq`. Distinct de
            `SNAPSHOT_EXPIRED` (instantané), identifiable par `code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Plus de 120 requêtes par minute pour la liaison (C1, v13-D4 ; valeur de départ, configurable).
            Compteur par liaison, compté après l'autorisation (une liaison suspendue ne consomme pas son
            quota) et avant la lecture des paramètres (une requête aux paramètres invalides compte).
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: |
            `RATE_LIMIT_UNAVAILABLE` (compteurs inaccessibles : rien n'est servi), `SCHEMA_UPGRADE_IN_PROGRESS`,
            `SCHEMA_UPGRADE_FAILED` ou `SERVICE_CAPACITY_REACHED`

  /catalog/changes/ack:
    post:
      operationId: acknowledgeCatalogChanges
      tags: [Catalogue]
      summary: Acquittement du curseur appliqué (condition de purge, D5)
      description: |
        **Implémenté (G17, plan § 30.10), non déployé.** `seq` = dernier `seq` dont les événements sont
        **appliqués** par la boutique (en pratique le `lastSeq` d'une page appliquée). *[Proposé] Règle du
        consommateur : n'acquitter que des événements appliqués, jamais avant la fin de l'instantané
        initial.* Les événements de `seq` inférieur ou égal à ce `seq` deviennent purgeables pour cette
        liaison : la purge supprime `repère < seq ≤ borne`, la borne ne dépassant jamais le plus petit
        acquittement des liaisons actives ou suspendues de l'entreprise, ni le `last_seq` lu au début du
        passage, et seulement après 90 jours (D5, plan § 30.4).

        Acquittement par liaison, enregistré dans la base de l'entreprise (v17-D3) ; la liaison est
        exclusivement celle du jeton. Il ne recule jamais : la valeur enregistrée devient
        `max(valeur enregistrée, seq)` en une seule opération atomique ; un `seq` inférieur ou égal, même
        sous le repère de purge, répond `200` avec la valeur réellement enregistrée (v17-D13) ; rejouer
        l'appel donne le même résultat (idempotent par valeur). La lecture suivante du flux garde son
        comportement (`410 CURSOR_EXPIRED` si `after` est sous le repère). GestStock ne vérifie pas que le
        `seq` a réellement été servi à la liaison (v17-D8) : un acquittement trop en avance ne fait perdre
        des événements qu'à elle.

        **Ordre de traitement (v17-D14)** : chaîne de sécurité (jeton, statut de la liaison, entreprise,
        migration, portée), puis limite de débit, puis type de contenu et lecture du corps, puis validation,
        puis enregistrement. Un appel refusé par la limite reçoit `429` sans que son corps soit lu ; un
        corps illisible compte dans la limite. Le corps est lu par la route elle-même, après la limite
        (Spring MVC lirait un `@RequestBody` avant la méthode) ; le `415` vient donc de la route : type de
        contenu absent, ou autre que `application/json` (des paramètres comme `charset=UTF-8` sont admis).

        **`seq` strict (v17-D12)** : entier JSON de 0 à 2⁶³ − 1, sans conversion implicite. Absent, `null`
        ou négatif : `400 VALIDATION_FAILED` (champ `seq` dans `errors`) ; chaîne, décimal (y compris
        `1.0`), booléen, objet, tableau ou entier hors des 64 bits, corps absent, vide, illisible ou autre
        chose qu'un objet JSON, clé répétée (`{"seq": 1, "seq": 2}`), contenu après l'objet :
        `400 MALFORMED_REQUEST`. Corps de plus de 1 024 octets : `413 CONTENT_TOO_LARGE`. Champs autres que `seq` : ignorés ; un objet sans `seq` reçoit
        donc `VALIDATION_FAILED`. Aucun extrait de la valeur reçue dans les réponses ni dans les journaux.

        Liaison révoquée : `401 LINK_REVOKED` ; suspendue : `403 LINK_SUSPENDED`, son dernier
        acquittement reste enregistré et continue de compter dans la purge. Une liaison active ou suspendue
        sans acquittement bloque la purge de l'entreprise (v17-D4). Réponses : `Cache-Control: no-store`.
      x-required-scopes: [catalog:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Corps de 1 024 octets au plus ; clés uniques ; champs autres que seq ignorés.'
              required: [seq]
              properties:
                seq: { type: integer, format: int64, minimum: 0, description: 'Entier JSON (ni chaîne, ni décimal, ni 1.0, ni notation exponentielle)' }
      responses:
        '200':
          description: Curseur acquitté ; `acknowledgedSeq` = valeur enregistrée après l'appel (jamais inférieure à la précédente)
          content:
            application/json:
              schema:
                type: object
                required: [acknowledgedSeq]
                properties:
                  acknowledgedSeq: { type: integer, format: int64, minimum: 0 }
        '400':
          description: |
            `VALIDATION_FAILED` (`seq` absent, `null` ou négatif ; le message nomme le champ, jamais la valeur
            reçue) ou `MALFORMED_REQUEST` (`seq` d'un autre type qu'un entier JSON sur 64 bits, ou corps
            absent, vide, illisible, qui n'est pas un objet JSON, avec une clé répétée ou un contenu après
            l'objet ; v17-D12). Un corps de plus de 1 024 octets reçoit `413` (choix E2). Une requête refusée par le
            pare-feu avant toute route reçoit un `400` sans corps (`FirewallRejected`, v15-D2).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '409':
          description: |
            `code = CURSOR_AHEAD` (v17-D6, comme `GET /catalog/changes`) : `seq` supérieur au dernier `seq`
            attribué ; rien n'est enregistré. Arrêter la synchronisation et alerter (v11-D2, v11-D11).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '413':
          description: '`CONTENT_TOO_LARGE` : corps de plus de 1 024 octets (choix E2, RFC 9110 § 15.5.14) ; rien n''est enregistré'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE` : type de contenu absent, ou autre que `application/json` (paramètres comme charset admis) ; contrôlé par la route, après la limite de débit et avant la lecture du corps'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Plus de 60 acquittements par minute pour la liaison (v17-D7 ; valeur de départ, configurable).
            Compteur propre à l'acquittement, distinct de celui de `GET /catalog/changes`. Appliqué avant la
            lecture du corps (v17-D14) : un appel refusé n'est ni lu ni enregistré.
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: |
            `RATE_LIMIT_UNAVAILABLE` (rien n'est enregistré), `SCHEMA_UPGRADE_IN_PROGRESS`,
            `SCHEMA_UPGRADE_FAILED` ou `SERVICE_CAPACITY_REACHED`

  /catalog/snapshot:
    get:
      operationId: getCatalogSnapshot
      tags: [Catalogue]
      summary: Instantané paginé du catalogue lié (réconciliation, reprise)
      description: |
        Renvoie l'état courant du catalogue visible par la liaison, avec la version de chaque objet
        (décision v11-D10). **Sections, servies dans cet ordre** : `categories`, `products`,
        `productImages` (un `ProductImageState` par produit), `availability` (une `Availability` par
        produit). **Objets archivés inclus** (`active: false`) : un consommateur qui refait un instantané
        complet peut archiver ce qu'il détient encore. `limit` compte les objets **toutes sections
        confondues** ; une page peut chevaucher deux sections ; les sections vides ou terminées sont
        servies en tableaux vides. **La dernière page peut être vide** (tableaux vides, sans
        `nextPageToken`) : accepté (v12-D3).

        **Disponibilité réservée à `stock:read`** (v17-D1, G18-D1) : sans cette portée, le champ
        `availability` est **absent** de chaque page (absent signifie « non autorisé », jamais « vide » ni
        « disponibilité 0 ») et l'instantané **s'arrête après `productImages`** ; la disponibilité n'est
        pas calculée. Un `pageToken` placé sur la section `availability` et présenté sans `stock:read`
        (jeton d'accès demandé ensuite avec moins de portées) reçoit une dernière page vide, sans
        `nextPageToken` ni quantité (G18-D2). La règle « produit absent de `availability` : disponibilité 0 »
        ne vaut donc qu'avec `stock:read`.

        Paramètres (G18, comme `GET /catalog/changes`) : chaque paramètre au plus une fois, sinon
        `400 INVALID_PARAMETER` ; `limit` entier décimal, sinon `400 INVALID_PARAMETER`, hors de 1..500
        `400 VALIDATION_FAILED` ; les autres paramètres sont ignorés. Limite : 60 appels par minute et par
        liaison, compteur propre à l'instantané, compté avant la lecture des paramètres. Réponses :
        `Cache-Control: no-store`. `HEAD` est servi implicitement comme `GET`, sans corps.
        **Produit absent de `productImages` ou `availability`** (créé pendant la pagination, après le
        passage de ces sections) : il est dans son **état initial**, pas d'image (version 0) et
        disponibilité 0 ; tout changement ultérieur arrive par le flux après `asOfSeq`. Aucun événement
        n'est publié à la création d'un produit (v12-D3).
        Versions : `@Version` de l'objet pour `categories` et `products` ; génération de l'image pour
        `productImages` (0 si le produit n'a jamais eu d'image) ; `asOfSeq` pour `availability`. Le
        consommateur applique la règle des versions à l'instantané comme au flux.
        `asOfSeq` est **fixé à la première page** (dernier `seq` attribué à cet instant) et
        **identique sur toutes les pages** de cet instantané. Un objet modifié pendant la pagination
        peut apparaître dans une version plus récente que `asOfSeq` : après la dernière page, reprendre
        le flux avec `after=asOfSeq` et appliquer la règle de version ; l'état obtenu équivaut à
        l'état source (décision C3).
      x-required-scopes: [catalog:read]
      parameters:
        - name: pageToken
          in: query
          description: |
            Absent pour la première page ; ensuite la valeur `nextPageToken` reçue. Jeton **opaque**
            (ne pas l'interpréter), **lié à la liaison** qui l'a obtenu et porteur de `asOfSeq`,
            valable **24 heures** à partir de la première page. Invalide, vide, de plus de 512 caractères
            ou émis pour une autre liaison : 400 `INVALID_PAGE_TOKEN`. Expiré : 410 `SNAPSHOT_EXPIRED`,
            recommencer sans `pageToken`.
            Sécurité (P4) : jeton **signé** (HMAC, clé serveur dédiée par environnement), **non chiffré** ;
            il porte un identifiant de clé (`kid`) et un numéro de format. Rotation : la clé courante
            signe, la clé précédente reste acceptée en vérification pendant 24 h ; `kid` inconnu ou
            signature invalide : 400 `INVALID_PAGE_TOKEN`.
            Le client ne suppose **ni la longueur** (512 caractères au plus), **ni le format, ni le
            contenu** du jeton : il le renvoie tel quel (décision v9-D2 ; encodage interne décidé au lot 1).
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          description: Nombre maximal d'objets de la page, toutes sections confondues (v11-D10)
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Page de l'instantané
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotPage' }
        '400':
          description: |
            `INVALID_PAGE_TOKEN` : jeton illisible, altéré, vide, de plus de 512 caractères ou émis pour une
            autre liaison ; `INVALID_PARAMETER` : paramètre répété ou `limit` non entier (« Paramètre
            invalide : limit. », « Paramètre répété : … ») ; `VALIDATION_FAILED` : `limit` hors de 1..500,
            paramètre fautif dans `errors`. Le message ne reprend jamais la valeur reçue. Requête refusée
            par le pare-feu avant toute route : `400` sans corps (`FirewallRejected`, v15-D2).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LinksDisabled' }
        '410':
          description: '`code = SNAPSHOT_EXPIRED` : jeton de plus de 24 heures ; recommencer l''instantané sans pageToken. Distinct de CURSOR_EXPIRED (flux), identifiable par code'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Plus de 60 requêtes par minute pour la liaison (C1, v13-D4 ; valeur de départ, configurable).
            Compteur propre à l'instantané, distinct de ceux du flux et de l'acquittement.
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: |
            `RATE_LIMIT_UNAVAILABLE` (rien n'est servi), `SCHEMA_UPGRADE_IN_PROGRESS`, `SCHEMA_UPGRADE_FAILED`
            ou `SERVICE_CAPACITY_REACHED`

  /catalog/products/search:
    get:
      operationId: searchCatalogProducts
      tags: [Catalogue]
      summary: Recherche de produits GestStock pour le rapprochement assisté
      description: Aucune association n'est créée par cet appel ; le rapprochement est confirmé côté boutique.
      x-required-scopes: [catalog:match]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Candidats
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /catalog/products/{productId}/image:
    get:
      operationId: getCatalogProductImage
      tags: [Catalogue]
      summary: Image principale d'un produit lié (JPEG)
      description: |
        **Implémenté (G19, plan § 32), non déployé.** Image JPEG binaire du produit (512 px de côté au
        plus, ré-encodée par GestStock à l'envoi, sans métadonnées), lue dans la base de l'entreprise de
        la liaison (G19-D1). *(Ébauche : `operationId` `getProductImage`, renommé : déjà attribué à la
        route `GET /api/products/{id}/image` de l'API principale.)*

        **Validation (G19-D2)** : `ETag` fort = empreinte SHA-256 de l'image entre guillemets, la même
        valeur que `imageSha256` du flux (`PRODUCT_IMAGE`) et de l'instantané (`productImages`) : comparer
        les empreintes avant de télécharger. `If-None-Match` contenant l'empreinte courante (seule, dans
        une liste, ou en `ETag` faible `W/`) : `304` sans corps. `If-None-Match: *` n'est **pas** traité
        comme une correspondance (comportement de Spring MVC, comme l'API principale) : `200`. Pas de
        `Last-Modified`. `Cache-Control: no-store` conservé (chaîne d'intégration) : le cache est celui de
        l'application JeCréeMaBoutique, qui garde l'image et son empreinte.

        **Un seul `404`** (G19-D3) : produit inexistant, d'une autre entreprise ou sans image reçoivent la
        même réponse `PRODUCT_IMAGE_NOT_FOUND` (aucune indication d'existence). L'existence d'un produit se
        lit dans le flux et l'instantané. Produit **archivé** : son image est servie (G19-D4).

        **Identifiant** (G19-D5) : forme canonique `8-4-4-4-12` en hexadécimal, majuscules admises ; sinon
        `400 INVALID_PARAMETER` « Paramètre invalide : productId. », sans citer la valeur.

        **Négociation** (G19-D7) : les erreurs sont toujours en `application/problem+json`, quel que soit
        `Accept` ; envoyer `Accept: image/jpeg, application/problem+json`.

        **Concurrence avec le flux** (G19-D9) : si l'image change entre l'événement et le téléchargement,
        l'`ETag` reçu diffère de l'empreinte annoncée ; le client enregistre l'`ETag` **reçu**, l'événement
        suivant (version supérieure) annoncera cette empreinte.

        Limite (G19-D6) : 120 appels par minute et par liaison, `304` compris, compteur propre à l'image.
        `HEAD` est servi implicitement comme `GET`, sans corps.
      x-required-scopes: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: If-None-Match
          in: header
          description: 'Empreinte détenue, entre guillemets (ETag reçu) : 304 si elle correspond à l''image courante'
          schema: { type: string }
      responses:
        '200':
          description: Image JPEG
          headers:
            ETag:
              description: 'Empreinte SHA-256 de l''image, entre guillemets (même valeur que imageSha256)'
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Cache-Control:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '304':
          description: 'Image inchangée : If-None-Match contient l''empreinte courante ; aucun corps'
          headers:
            ETag: { schema: { type: string } }
        '400':
          description: |
            `INVALID_PARAMETER` : identifiant non canonique (« Paramètre invalide : productId. », sans la
            valeur reçue) ; `VALIDATION_FAILED` : caractère de contrôle dans le chemin (G15). Requête refusée
            par le pare-feu avant toute route : `400` sans corps (`FirewallRejected`, v15-D2).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            `PRODUCT_IMAGE_NOT_FOUND` : produit inexistant, d'une autre entreprise ou sans image (réponse
            identique, G19-D3). `RESOURCE_NOT_FOUND` : liaisons désactivées (`LinksDisabled`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: |
            Plus de 120 appels par minute pour la liaison (G19-D6 ; valeur de départ, configurable), `304`
            compris. Compteur propre à l'image, distinct de ceux du flux, de l'acquittement et de l'instantané.
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: |
            `RATE_LIMIT_UNAVAILABLE` (rien n'est servi), `SCHEMA_UPGRADE_IN_PROGRESS`, `SCHEMA_UPGRADE_FAILED`
            ou `SERVICE_CAPACITY_REACHED`

  /prices/proposals:
    post:
      operationId: createPriceProposal
      tags: [Prix]
      summary: Proposer un prix de vente boutique (soumis à approbation, D2)
      description: |
        Crée une proposition `PROPOSED` (ou la renvoie si la clé d'idempotence a déjà servi). Tant
        qu'elle n'est pas approuvée dans GestStock (permission `integration:price-approve`), seul le
        dernier prix approuvé est commercialisable. L'approbation se fait dans GestStock, pas par
        cette API.

        **Concurrence (décision C6)** : une seule proposition `PROPOSED` par couple (liaison, produit).
        Les propositions concurrentes sont **sérialisées sur ce couple** par un verrou en base : la
        nouvelle proposition fait passer la précédente à `SUPERSEDED` dans la même transaction. La
        proposition retenue est celle qui **obtient le verrou en dernier** ; l'ordre n'est pas déduit
        d'un horodatage applicatif. L'approbation, côté GestStock, n'aboutit que si la proposition est
        encore `PROPOSED` (mise à jour conditionnée par `status = 'PROPOSED'`) ; sinon l'approbateur
        reçoit un conflit et aucun prix n'est approuvé.

        `basedOnReferenceVersion` différent de la version courante du prix de référence : refus
        `422 PRICE_VERSION_MISMATCH`, aucune proposition créée ; la boutique relit le prix de référence.
      x-required-scopes: [price:propose]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceProposalRequest' }
      responses:
        '201':
          description: Proposition enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelPrice' }
        '200':
          description: Requête rejouée — proposition déjà enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /prices:
    get:
      operationId: listPrices
      tags: [Prix]
      summary: Prix de la boutique (référence, proposé, approuvé) par produit lié
      x-required-scopes: [catalog:read]
      parameters:
        - name: productIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Prix
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /availability:
    get:
      operationId: getAvailability
      tags: [Disponibilité]
      summary: Disponibilité indicative sur les seuls dépôts associés actifs
      description: |
        `available` = stock − réservations actives (non expirées) des dépôts associés actifs ;
        par dépôt unique (défaut) le maximum d'un dépôt, en allocation multi-dépôts la somme.
        Information non garantie : seule une réservation garantit une quantité.
      x-required-scopes: [stock:read]
      parameters:
        - name: productIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Disponibilités
          content:
            application/json:
              schema:
                type: object
                properties:
                  computedAt: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Availability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /online-orders:
    post:
      operationId: createOnlineOrder
      tags: [Commandes, Réservations]
      summary: Transmettre une commande en ligne (et demander la réservation)
      description: |
        Idempotence par **clé naturelle** (liaison, `externalOrderId`) (C4, v13-D5) : aucun en-tête
        `Idempotency-Key` sur cette opération. **Renvoi identique** (même `externalOrderId`, même corps) :
        la commande déjà créée est renvoyée avec **le même statut et le même corps que la première
        réponse** (même réservation), **sans en créer de seconde**. `409 IDEMPOTENCY_KEY_REUSED` ne
        concerne que le même `externalOrderId` envoyé avec un **corps différent**.
        *(Première rédaction v13 : renvoi identique en `200`.)*
        *(v12 et antérieures : `Idempotency-Key` = identifiant de la commande JeCréeMaBoutique.)*
        Limites (v13-D5) : 100 lignes au plus, quantité ≤ 9 999 par ligne (au-delà des limites
        actuelles de JeCréeMaBoutique : 50 lignes, quantité 999). Débit (C1, v13-D4) : 60 créations
        par minute et par liaison (valeur de départ, configurable). GestStock contrôle : liaison active, produits liés,
        version de prix approuvée pour chaque ligne, dépôts associés actifs, quantités. Si la
        réservation est activée pour la liaison, elle est créée dans la même transaction
        (verrous ordonnés), avec `expiresAt` = heure serveur PostgreSQL + durée configurée
        (30 min par défaut, D3). Allocation impossible en totalité (livraison partielle
        désactivée) : commande `REJECTED_STOCK`, aucune réservation conservée.
        **Aucune vente n'est créée** : la conversion en vente se fait au point de vente par le
        personnel, avec caisse ouverte pour tout paiement.
      x-required-scopes: [orders:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineOrderRequest' }
      responses:
        '201':
          description: |
            Commande reçue (réservée ou refusée selon le stock). Un renvoi identique du même
            `externalOrderId` reçoit cette même réponse (même statut, même corps), sans seconde commande.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
          description: '`IDEMPOTENCY_KEY_REUSED` : `externalOrderId` déjà reçu pour cette liaison avec un corps différent'
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Plus de 60 créations par minute pour la liaison (C1, v13-D4 ; valeur de départ, configurable)
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /online-orders/{orderId}:
    get:
      operationId: getOnlineOrder
      tags: [Commandes]
      summary: État d'une commande transmise
      description: Portée `orders:read` (ou `orders:write`, qui l'implique).
      x-required-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Commande
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '404': { $ref: '#/components/responses/NotFound' }

  /online-orders/external/{externalOrderId}:
    get:
      operationId: getOnlineOrderByExternalId
      tags: [Commandes]
      summary: Retrouver une commande par l'identifiant JeCréeMaBoutique (décision C4)
      description: |
        Recherche limitée à la liaison authentifiée. Le couple (liaison, `externalOrderId`) est
        unique : c'est aussi la clé d'idempotence de `POST /online-orders`, si bien que cette lecture
        renvoie la commande qu'un `POST` rejoué renverrait. Sert à la reprise après une réponse perdue
        et au rapprochement. Commande inexistante **ou** appartenant à une autre liaison : la même
        réponse 404, sans révéler l'existence d'une commande étrangère.
        Portée `orders:read` (ou `orders:write`, qui l'implique).
      x-required-scopes: [orders:read]
      parameters:
        - name: externalOrderId
          in: path
          required: true
          description: Identifiant de la commande JeCréeMaBoutique (`Order._id`)
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Commande
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '404': { $ref: '#/components/responses/NotFound' }

  /online-orders/{orderId}/cancel:
    post:
      operationId: cancelOnlineOrder
      tags: [Commandes, Réservations]
      summary: Annulation demandée par la boutique ou le client
      description: |
        Libère la réservation une seule fois (`UPDATE … WHERE status = 'RESERVED'`). Une commande
        déjà convertie en vente (`CONVERTED`) ne peut plus être annulée par cette API (retour client
        dans GestStock). Rejouer renvoie l'état final.
      x-required-scopes: [orders:write]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Commande annulée (ou déjà dans un état final compatible)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlineOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ORDER_NOT_CANCELLABLE` (déjà convertie)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }

# Webhook retiré de la v1 (v13-D3) : la consommation du flux se fait par interrogation périodique
# depuis le VPS JeCréeMaBoutique. Historique (v12 et antérieures) : webhook
# geststockChangesAvailable, signal sans données signé HMAC-SHA256 (fenêtre de 5 min, déduplication
# par eventId). Une notification sans données pourra être ajoutée dans une version ultérieure.

components:
  securitySchemes:
    linkToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton de liaison obtenu par `client_credentials` (v13-D5) : JWT de **15 min**,
        `aud=geststock-integration`, `sub`=identifiant de liaison, portées dans `scope`.
        **`iss=geststock-integration`**, claim **`typ=integration`**, en-tête JOSE **`typ=at+jwt`**
        (RFC 9068) (v14-D4), tous distincts de ceux des jetons utilisateurs (`iss=geststock`, claim
        `typ` `tenant` ou `platform`) ; signé par une **clé distincte** de celle des jetons
        utilisateurs. Signature, émetteur, types, audience et expiration vérifiés, puis **statut de la
        liaison relu en base à chaque appel** (révocation immédiate, C2 ; suspension, v14-D10). Un
        jeton d'utilisateur GestStock est refusé par la chaîne d'intégration ; un jeton de liaison est
        refusé par l'API principale.
        Portée exigée par opération : `x-required-scopes`. Implication (décision C5) : un jeton portant
        `orders:write` satisfait aussi `orders:read` ; aucune autre implication entre portées.
        Deux niveaux d'identifiants (v14-D3) : le **client** JeCréeMaBoutique (`clientBasic`, un par
        environnement) et le **secret de la liaison** (un par liaison), tous deux exigés par
        `client_credentials`.
        Secret de liaison (v13-D5, v14-D5) : généré par GestStock à l'échange du code et renvoyé une
        seule fois au backend JeCréeMaBoutique ; conservé côté GestStock sous forme d'empreinte
        **SHA-256**, comparée en **temps constant** ; chiffré côté JeCréeMaBoutique (AES-GCM, clé propre
        à l'intégration, hors Git et hors base). **Rotation** (v14-D6) : `POST /link/secret`, de
        serveur à serveur ; l'ancien secret reste accepté jusqu'au premier usage du nouveau, 24 h au
        plus.
        Origine (v13-D5, v14-D8) : liste blanche facultative de l'IP du VPS JeCréeMaBoutique, activable
        par configuration, **en plus** de l'authentification (jamais à sa place). L'IP est lue dans un
        **seul en-tête configurable posé par le proxy de l'hébergeur** (Render depuis v16-D1 ; v14 :
        Vercel), jamais dans `X-Forwarded-For` brut. Nom de cet en-tête : **à confirmer en I1**
        (vérification avec un `X-Forwarded-For` falsifié) ;
        réglage `geststock.integration.client-ip-header` (variable
        `GESTSTOCK_INTEGRATION_CLIENT_IP_HEADER` en production), obligatoire quand les liaisons sont
        activées (v15). L'IP sert aussi au compteur de débit par IP de `/oauth/par` et `/oauth/token`.
        *(v12 et antérieures : `iss=geststock`, `aud=geststock-integration-v1` et durée 5 min, en
        hypothèse ; v13 : `iss` et `typ` « fixés au lot 2 », rotation « à définir au lot 2 ».)*
    clientBasic:
      type: http
      scheme: basic
      description: |
        Identifiant et secret du **client** JeCréeMaBoutique, un jeu par environnement (v14-D3), sur
        `/oauth/par` et `/oauth/token` seulement. Distinct du secret de chaque liaison.
        Encodage (RFC 6749 § 2.3.1, v15) : identifiant et secret sont chacun encodés au format
        `application/x-www-form-urlencoded` **avant** d'être joints par `:` puis encodés en Base64 ;
        GestStock les décode dans le même ordre. En-tête absent, illisible (Base64 invalide, sans `:`,
        identifiant vide) ou contenant un caractère de contrôle après décodage : `401 invalid_client`
        (en-tête `WWW-Authenticate: Basic`), sans requête en base. Chaque échec est inscrit au journal
        d'audit (`CLIENT_AUTHENTICATION_FAILED`), sans l'identifiant annoncé s'il est illisible et jamais
        avec le secret (v15-D1).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique par liaison et par opération ; **conservée 7 jours** (v13-D5 ; *v12 et antérieures :
        90 jours, en hypothèse*). Même clé avec un corps différent : `409 IDEMPOTENCY_KEY_REUSED`.
        Non utilisée par `POST /online-orders`, idempotente par (liaison, `externalOrderId`).
      schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      description: |
        Identifiant GestStock de la commande en ligne (UUID). Contraint par `pattern` : un segment
        littéral comme `external` ne peut pas être un `orderId` valide, donc `/online-orders/{orderId}/…`
        et `/online-orders/external/{externalOrderId}` ne peuvent jamais désigner la même ressource
        (l'avertissement `no-ambiguous-paths` de Redocly est structurel et documenté comme exception).
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

  responses:
    BadRequest:
      description: |
        Données invalides : `VALIDATION_FAILED` (champ refusé, caractère de contrôle compris ; le message
        nomme le champ, jamais la valeur reçue) ou `MALFORMED_REQUEST` (corps JSON illisible : syntaxe,
        type, UUID). Aucun extrait de la valeur reçue dans la réponse ni dans les journaux (v15).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Jeton absent, invalide, expiré, ou liaison révoquée (`INVALID_TOKEN`, `LINK_REVOKED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: |
        Dans l'ordre des contrôles :
        - liaison suspendue (`LINK_SUSPENDED`, v14-D10 : sur toutes les routes sauf `GET /link` et
          `POST /link/revoke` ; motif lisible par `GET /link`) ;
        - entreprise non active (v15) : `COMPANY_SUSPENDED` (entreprise suspendue) ou
          `COMPANY_UNAVAILABLE` (tout autre statut) ; jamais sur `POST /link/revoke` ;
        - portée insuffisante (`INSUFFICIENT_SCOPE`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Objet introuvable pour cette liaison (jamais de distinction « appartient à une autre entreprise »)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    IdempotencyConflict:
      description: '`IDEMPOTENCY_KEY_REUSED` : même clé, corps différent'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BusinessRule:
      description: |
        Règle métier : `PRICE_NOT_APPROVED`, `PRICE_VERSION_MISMATCH`, `PRODUCT_NOT_LINKED`,
        `WAREHOUSE_NOT_AUTHORIZED`, `PRODUCT_ARCHIVED`.
        `PRICE_VERSION_MISMATCH` : sur une proposition de prix, `basedOnReferenceVersion` n'est plus la
        version courante du prix de référence (C6).
        Un stock insuffisant n'est pas une erreur : la commande est enregistrée à l'état
        `REJECTED_STOCK`, entièrement refusée, sans réservation conservée (plan § 5.2 règle 5, § 5.4).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: |
        `RATE_LIMITED` : limite de débit dépassée (C1, v13-D4). Compteurs en fenêtre fixe tenus par
        GestStock (base plateforme), par liaison ; sur `/oauth/par` et `/oauth/token`, deux compteurs
        **séparés** (v15) : par IP **avant** l'authentification du client (toutes tentatives comprises,
        y compris un mauvais secret ou un identifiant illisible), par client **après** une
        authentification réussie seulement (annoncer l'identifiant du client sans son secret n'épuise
        jamais son quota). Attendre `Retry-After` secondes avant de réessayer.
      headers:
        Retry-After:
          required: true
          description: Délai en secondes avant la fin de la fenêtre en cours
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimitUnavailable:
      description: |
        `RATE_LIMIT_UNAVAILABLE` : les compteurs de débit sont inaccessibles ; la requête est
        **refusée**, jamais laissée passer (C1, v13-D4). Réessayer plus tard.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: |
        Service momentanément indisponible pour cette liaison (v15), réessayer plus tard :
        - `SCHEMA_UPGRADE_IN_PROGRESS` : la base de l'entreprise est en cours de migration ;
        - `SCHEMA_UPGRADE_FAILED` : la dernière migration de la base de l'entreprise a échoué ;
        - `RATE_LIMIT_UNAVAILABLE` : sur les routes limitées en débit, compteurs inaccessibles (la requête
          est refusée, jamais laissée passer) ;
        - `SERVICE_CAPACITY_REACHED` : sur les routes qui lisent la base de l'entreprise, plafond de
          connexions atteint.
        Chaque opération précise ceux qu'elle peut renvoyer. Jamais sur `POST /link/revoke`, qui ne
        touche que la base plateforme et n'est pas limitée en débit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    LinksDisabled:
      description: |
        `RESOURCE_NOT_FOUND` : liaisons désactivées (`geststock.integration.links.enabled=false`, valeur
        par défaut) ; toute la chaîne d'intégration répond comme une route inconnue, avant toute
        authentification.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }
    FirewallRejected:
      description: |
        Requête refusée par le pare-feu HTTP avant toute route (par exemple caractère de contrôle dans un
        en-tête, `%00` dans l'URL) : `400` **sans corps** (v15-D2).
    InternalError:
      description: |
        `INTERNAL_ERROR` : erreur inattendue, journalisée côté GestStock sans valeur reçue ; format
        `ApiError`, y compris sur `/oauth/par` et `/oauth/token`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    ApiError:
      description: Format d'erreur existant de GestStock (exception/ApiError, RFC 9457)
      type: object
      required: [type, title, status, code, message]
      properties:
        type: { type: string, examples: ['urn:geststock:error:insufficient-stock'] }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        details: { type: object, additionalProperties: true }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }

    OAuthError:
      description: |
        Erreur de `/oauth/par` et `/oauth/token` (RFC 6749 § 5.2), `Cache-Control: no-store`.
        `error_description` ne reprend jamais une valeur reçue ni un secret.
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unsupported_grant_type, invalid_scope, temporarily_unavailable]
          description: '`temporarily_unavailable` (503) : échange du code impossible pour l''instant, code non consommé (v15)'
        error_description: { type: string }
        code:
          type: string
          enum: [LINK_REVOKED]
          description: |
            Précision propre à GestStock (v15), présente seulement avec `invalid_grant` sur
            `client_credentials` quand la liaison est révoquée : le client cesse d'utiliser cette liaison.

    PushedAuthorizationRequest:
      description: |
        Demande d'autorisation déposée par le backend JeCréeMaBoutique (RFC 9126, v14-D1). Chaque
        paramètre une seule fois, dans le corps seulement ; aucun caractère de contrôle (U+0000 à
        U+001F, U+007F), tabulation et sauts de ligne compris : sinon `invalid_request` (v15).
      type: object
      required: [response_type, redirect_uri, code_challenge, code_challenge_method, scope, state, shop_id, shop_name]
      properties:
        response_type: { type: string, const: code }
        redirect_uri: { type: string, format: uri, description: 'Comparée à l''identique à la liste blanche du client pour l''environnement (v14-D12)' }
        code_challenge: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$', description: 'BASE64URL(SHA-256(code_verifier))' }
        code_challenge_method: { type: string, const: S256 }
        scope: { type: string, description: 'Portées demandées, séparées par des espaces (valeurs de Scope) ; au moins une, toutes autorisées pour le client, sinon invalid_scope' }
        state: { type: string, minLength: 32, maxLength: 512, description: 'Valeur opaque de JeCréeMaBoutique, renvoyée telle quelle à redirect_uri' }
        shop_id: { type: string, minLength: 1, maxLength: 64, description: 'Identifiant de la boutique (User._id JeCréeMaBoutique), non blanc ; jamais un e-mail, un nom ni un slug' }
        shop_name: { type: string, minLength: 1, maxLength: 200, description: 'Nom affiché sur l''écran de consentement (information seulement), non blanc' }

    PushedAuthorizationResponse:
      type: object
      required: [request_uri, expires_in]
      properties:
        request_uri: { type: string, pattern: '^urn:ietf:params:oauth:request_uri:', description: 'À usage unique ; à transmettre au frontend GestStock avec client_id' }
        expires_in: { type: integer, examples: [600], description: 'Secondes ; 600 (10 min)' }

    AuthorizationCodeGrant:
      type: object
      required: [grant_type, code, redirect_uri, code_verifier]
      properties:
        grant_type: { type: string, const: authorization_code }
        code: { type: string, maxLength: 128 }
        redirect_uri: { type: string, format: uri, description: 'Identique, caractère pour caractère, à celle de la demande déposée (/oauth/par) et à la liste blanche' }
        code_verifier: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$', description: 'Vérificateur PKCE (S256), conservé par le backend JeCréeMaBoutique' }

    ClientCredentialsGrant:
      type: object
      required: [grant_type, link_id, link_secret]
      properties:
        grant_type: { type: string, const: client_credentials }
        link_id: { type: string, format: uuid }
        link_secret: { type: string, minLength: 32, maxLength: 256 }
        scope: { type: string, description: Sous-ensemble des portées accordées }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, examples: [900], description: 'Secondes ; 900 (15 min) pour un jeton de liaison (v13-D5)' }
        scope: { type: string }
        link:
          description: Présent uniquement à l'échange de code
          $ref: '#/components/schemas/Link'
        link_secret:
          type: string
          description: Présent uniquement à l'échange de code ; à chiffrer immédiatement, jamais journalisé

    LinkSecretResponse:
      type: object
      required: [link_secret, rotatedAt, previousSecretValidUntil]
      properties:
        link_secret: { type: string, minLength: 32, maxLength: 256, description: 'Nouveau secret, renvoyé une seule fois ; à chiffrer immédiatement, jamais journalisé' }
        rotatedAt: { type: string, format: date-time }
        previousSecretValidUntil: { type: string, format: date-time, description: 'Limite de validité de l''ancien secret (24 h au plus) ; il cesse plus tôt dès le premier usage du nouveau' }

    Scope:
      type: string
      enum: [catalog:read, catalog:match, price:propose, stock:read, orders:read, orders:write]

    Link:
      type: object
      required: [id, status, companyCode, externalShopId, currency, scopes, warehouses, settings, createdAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, REVOKED]
          description: |
            `PENDING` : créée à l'approbation, en attente de l'échange du code (jamais utilisable) ;
            `ACTIVE` après l'échange ; `SUSPENDED` : voir `suspensionReason` (v14-D10) ; `REVOKED` :
            définitif.
        suspensionReason:
          type: [string, 'null']
          enum: [MANUAL, AUTHORIZER_LOST_ACCESS, null]
          description: |
            Renseigné seulement si `status = SUSPENDED` (v14-D10). Réactivation par une personne
            GestStock disposant de `integration:manage`, qui reconfirme les dépôts. Pendant la
            suspension, la publication des événements continue.
        revocationReason:
          type: [string, 'null']
          enum: [SHOP_REQUEST, GESTSTOCK_ADMIN, CODE_REPLAYED, EXPIRED, null]
          description: |
            Motif de la révocation ; **nul seulement tant que la liaison n'est pas révoquée** (renseigné
            dès que `status = REVOKED`) :
            - `SHOP_REQUEST` : révocation demandée par la boutique (`POST /link/revoke`, C2) ; le motif
              libre éventuel est inscrit au journal d'audit ;
            - `GESTSTOCK_ADMIN` : révocation par une personne GestStock disposant de `integration:manage` ;
            - `CODE_REPLAYED` : code d'autorisation rejoué (v14-D14) ;
            - `EXPIRED` : liaison `PENDING` dont le code a expiré, révoquée au dépôt d'une nouvelle
              demande pour la même boutique.
            **Évolution sans rupture** : de nouvelles valeurs pourront être ajoutées ; le consommateur
            **tolère une valeur inconnue** (il la traite comme une révocation au motif non précisé).
        companyCode: { type: string, description: 'Code public de l''entreprise (platform.company.code), jamais un nom de base' }
        companyName:
          type: [string, 'null']
          maxLength: 150
          description: |
            Nom affichable de l'entreprise (v15) : nom commercial (`platform.company.trade_name`, 150
            caractères au plus), lu avec la liaison, sans requête de plus ; `null` s'il est vide. Facultatif
            et seulement affichable : jamais un identifiant (voir `companyCode`). Présent dans toutes les
            réponses `Link` (échange du code, `GET /link`, `POST /link/revoke`), après les champs existants.
        currency: { type: string, pattern: '^[A-Z]{3}$', examples: [XOF], description: 'Devise de la liaison, code ISO 4217 normalisé depuis platform.company.currency (v11-D6)' }
        externalShopId: { type: string, description: Identifiant de la boutique (User._id JeCréeMaBoutique) }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        warehouses:
          type: array
          description: |
            Dépôts vendables de la liaison (v11-D8). **Vide** pour une liaison révoquée (réponse de
            `POST /link/revoke`) et, à l'échange du code seulement, si la base de l'entreprise n'a pas pu
            être lue (`GET /link` les donnera). Pas de `priority` (v15 : non implémentée, *v14 et
            antérieures : `priority` entier ≥ 0, facultative*).
          items:
            type: object
            required: [warehouseId, name, active]
            properties:
              warehouseId: { type: string, format: uuid }
              name: { type: string }
              active: { type: boolean }
        settings:
          type: object
          description: 'Toujours `{}` pour l''instant (v15) : les réglages arrivent avec les lots qui les définissent.'
          properties:
            priceApproval: { type: string, enum: [REQUIRED, NOT_REQUIRED], default: REQUIRED }
            reservationEnabled: { type: boolean }
            multiWarehouseAllocation: { type: boolean, default: false }
            partialFulfilment: { type: boolean, default: false }
            reservationTtlSeconds: { type: integer, examples: [1800], description: Lecture seule ; configuré côté serveur (D3) }
        createdAt: { type: string, format: date-time }
        lastSyncAt: { type: [string, 'null'], format: date-time, description: 'Toujours null pour l''instant (v15) : renseignée par le lot qui définit la synchronisation' }
        revokedAt: { type: [string, 'null'], format: date-time }

    ChangePage:
      type: object
      required: [items, hasMore, lastSeq]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChangeEvent' }
        hasMore: { type: boolean, description: 'P2 : vrai s''il existe un événement de seq > lastSeq ou un événement validé sans seq (évalué après attribution) ; rappeler immédiatement. Faux : reprendre plus tard, pas une fin définitive' }
        lastSeq: { type: integer, format: int64, description: 'P1 : dernier seq examiné, filtrés compris ; after si rien n''a été examiné. lastSeq ≥ after ; toujours enregistré comme nouvel after' }

    ChangeEventBase:
      description: |
        Champs communs à tous les événements. `data` (état complet de l'objet, jamais un
        différentiel, aucune donnée personnelle) est **obligatoire pour `UPSERT`** et **facultatif pour
        `ARCHIVE`**. Ordre d'application : par couple (`type`, `objectId`), selon `version`.
        Origine de `version` : propre à chaque type (P3), précisée dans chaque variante ; toujours
        strictement croissante pour un même objet (règle R2).
      type: object
      required: [seq, type, objectId, version, operation, occurredAt]
      properties:
        seq: { type: integer, format: int64, description: 'Position dans le flux : seule clé d''ordre (v11-D5)' }
        type: { type: string, description: 'Type de l''événement ; un type inconnu du consommateur est ignoré et le curseur avance ; GestStock sert tel qu''il est stocké un type inconnu de sa propre version, sans jamais bloquer le flux (v11-D4)' }
        objectId: { type: string, format: uuid }
        version: { type: integer, format: int64, description: 'Version de l''objet ; un événement de version ≤ dernière appliquée pour le même (type, objectId) est ignoré' }
        operation: { type: string, enum: [UPSERT, ARCHIVE] }
        occurredAt: { type: string, format: date-time, description: 'Informatif : heure de début de la transaction qui a écrit l''événement. Ne sert jamais à ordonner : l''ordre repose uniquement sur seq (v11-D5)' }
        data:
          description: 'État de l''objet ; son schéma est fixé par chaque variante (discriminée par type). Obligatoire pour UPSERT, facultatif pour ARCHIVE : un événement sans état est servi sans le champ data (omis, jamais null) (G16).'
      if:
        properties:
          operation: { const: UPSERT }
      then:
        required: [data]

    ChangeEvent:
      description: |
        Un schéma par `type` (décision C7), discriminé par `type`. Une modification du prix de
        référence est publiée comme événement `PRODUCT` (champ `referencePrice`) ; il n'existe pas de
        type `REFERENCE_PRICE`. Le consommateur ignore un `type` absent de cette liste et avance son
        curseur, après l'avoir reçu selon les garanties de livraison du flux (au moins une fois, ordre
        par `seq`). Côté GestStock, un type stocké mais inconnu de la version qui sert la page est servi
        tel qu'il est stocké (`type`, `operation`, `objectId`, `version`, `data`) : il ne bloque jamais
        le flux (v11-D4).
      oneOf:
        - $ref: '#/components/schemas/CategoryChangeEvent'
        - $ref: '#/components/schemas/ProductChangeEvent'
        - $ref: '#/components/schemas/ProductImageChangeEvent'
        - $ref: '#/components/schemas/ChannelPriceChangeEvent'
        - $ref: '#/components/schemas/AvailabilityChangeEvent'
        - $ref: '#/components/schemas/OnlineOrderStatusChangeEvent'
      discriminator:
        propertyName: type
        mapping:
          CATEGORY: '#/components/schemas/CategoryChangeEvent'
          PRODUCT: '#/components/schemas/ProductChangeEvent'
          PRODUCT_IMAGE: '#/components/schemas/ProductImageChangeEvent'
          CHANNEL_PRICE: '#/components/schemas/ChannelPriceChangeEvent'
          AVAILABILITY: '#/components/schemas/AvailabilityChangeEvent'
          ONLINE_ORDER_STATUS: '#/components/schemas/OnlineOrderStatusChangeEvent'

    CategoryChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`version` (P3, entité jamais supprimée physiquement) : `@Version` de la catégorie, lu après flush dans la transaction qui l''a modifiée (R1) ; `data` = état écrit dans cette transaction.'
          properties:
            type: { const: CATEGORY }
            data: { $ref: '#/components/schemas/Category' }

    ProductChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: 'Inclut les changements du prix de référence (`Product.referencePrice`). `version` (P3, entité jamais supprimée physiquement) : `@Version` du produit, lu après flush (R1) ; `data` = état écrit dans la transaction.'
          properties:
            type: { const: PRODUCT }
            data: { $ref: '#/components/schemas/Product' }

    ProductImageChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`objectId` = identifiant du produit (au plus une image par produit). `version` (P3, objet supprimable) : génération durable `product_image_generation` (P7), voir ProductImageState.'
          properties:
            type: { const: PRODUCT_IMAGE }
            data: { $ref: '#/components/schemas/ProductImageState' }

    ChannelPriceChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`version` : origine **à confirmer** (P3 — famille non décidée, lots 3-4, à la lecture du modèle `channel_price`).'
          properties:
            type: { const: CHANNEL_PRICE }
            data: { $ref: '#/components/schemas/ChannelPrice' }

    AvailabilityChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: |
            Événement **mince** (P3, agrégat calculé) : `version` = `seq` de l'événement. L'événement ne
            fige pas de valeur à l'écriture : `data` est **recalculé au moment de servir la page**, depuis
            les données validées. Plusieurs événements du même produit dans une page peuvent être
            fusionnés en un seul (le plus grand `seq`). Raison : deux transactions concurrentes tenant
            des verrous différents (par exemple deux ventes du même produit dans deux dépôts) peuvent
            chacune calculer un agrégat qui ignore l'autre ; une valeur figée à l'écriture pourrait être
            fausse. Servi seulement aux liaisons qui ont la portée `stock:read` (G16) ; écarté sinon,
            `lastSeq` avançant quand même.
          properties:
            type: { const: AVAILABILITY }
            data: { $ref: '#/components/schemas/Availability' }

    OnlineOrderStatusChangeEvent:
      allOf:
        - $ref: '#/components/schemas/ChangeEventBase'
        - type: object
          description: '`version` : origine **à confirmer** (P3 — famille non décidée, lots 3-4, à la lecture du modèle des commandes en ligne).'
          properties:
            type: { const: ONLINE_ORDER_STATUS }
            data: { $ref: '#/components/schemas/OnlineOrderStatus' }

    ProductImageState:
      description: |
        État de l'image principale d'un produit (décision C7). `imageSha256` nul : le produit n'a plus
        d'image ; sinon, relire `/catalog/products/{productId}/image` si l'empreinte a changé.
        `version` (P7) = génération lue dans `product_image_generation` : compteur par produit, jamais
        supprimé avec l'image, incrémenté par la première instruction de la transaction d'image
        (`INSERT … ON CONFLICT … RETURNING`), dans la même transaction que l'image et l'événement ;
        strictement croissant, y compris après suppression puis ajout ou en cas de concurrence.
        Retrait d'une image : événement `UPSERT` avec `imageSha256 = null` et une génération incrémentée.
        P6 : image renvoyée avec une empreinte inchangée, ou suppression d'une image inexistante : ni
        incrément, ni événement. Dans l'instantané (section `productImages`, v11-D10) : un état par
        produit, `version` = 0 si le produit n'a jamais eu d'image (aucune génération), `imageSha256` nul
        si aucune image. Seule source de l'état de l'image : `Product` ne porte plus `imageSha256` (v11-D7).
        *(v7 : point bloquant « source de version » — résolu sur le plan documentaire par P7 ;
        implémentation et tests au lot 1.)*
      type: object
      required: [productId, imageSha256, version]
      properties:
        productId: { type: string, format: uuid }
        imageSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        version: { type: integer, format: int64 }

    SnapshotPage:
      description: |
        Page de l'instantané (décision v11-D10). En-tête : `asOfSeq`, `currency`, `nextPageToken`.
        Sections, dans cet ordre : `categories`, `products`, `productImages`, `availability` ; `limit`
        compte les objets toutes sections confondues, une page peut chevaucher deux sections, une section
        sans objet dans la page est un tableau vide. Objets archivés inclus (`active: false`) ; les
        sections `productImages` et `availability` couvrent tous les produits, archivés compris ; un
        produit absent de ces sections (créé pendant la pagination) est dans son état initial : pas
        d'image (version 0), disponibilité 0. La dernière page peut être vide, sans `nextPageToken`
        (v12-D3).
        *(v10 : sections `categories` et `products` seulement, `nextPageToken` nul sur la dernière page,
        devise portée par chaque `Product` — remplacé.)*
      type: object
      required: [asOfSeq, currency, categories, products, productImages]
      properties:
        asOfSeq: { type: integer, format: int64, description: 'Fixé à la première page, identique sur toutes les pages ; reprendre le flux avec `after=asOfSeq`' }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [XOF]
          description: 'Devise de l''entreprise, code ISO 4217, normalisée depuis platform.company.currency (FCFA, F CFA, XOF → XOF) ; une seule fois par page, jamais par produit (v11-D6)'
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        productImages:
          type: array
          description: 'Un état par produit, archivés compris : version = génération de l''image, 0 si le produit n''a jamais eu d''image ; imageSha256 nul si aucune image'
          items: { $ref: '#/components/schemas/ProductImageState' }
        availability:
          type: array
          description: 'Une disponibilité par produit, archivés compris ; version de chaque entrée = asOfSeq de l''en-tête (aucun champ version dans Availability). Présent seulement avec la portée stock:read ; absent sinon (non autorisé, à ne pas lire comme une disponibilité 0), G18-D1'
          items: { $ref: '#/components/schemas/Availability' }
        nextPageToken: { type: string, maxLength: 512, description: 'Opaque, lié à la liaison, valable 24 h depuis la première page ; **absent** sur la dernière page. Longueur, format et contenu non garantis (v9-D2) : renvoyer tel quel' }

    Category:
      type: object
      required: [id, name, active, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 255 }
        active: { type: boolean }
        version: { type: integer, format: int64 }

    Product:
      description: |
        Champs détenus par GestStock ; le prix d'achat n'est jamais exposé. La devise n'est pas portée
        par le produit : elle est exposée une seule fois, sur la liaison (lot 2) et dans l'en-tête de
        l'instantané (v11-D6). L'état de l'image passe uniquement par `PRODUCT_IMAGE` (v11-D7).
        *(v10 : `currency` et `imageSha256` dans `Product` — retirés en v11.)*
      type: object
      required: [id, sku, name, categoryId, unit, referencePrice, active, version]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        categoryId: { type: string, format: uuid }
        unit: { type: string, enum: [UNIT, PAIR, BOX, BOTTLE] }
        referencePrice: { type: string, description: 'Prix de détail GestStock, décimal en chaîne (ex. "6000.00")' }
        active: { type: boolean }
        version: { type: integer, format: int64 }

    PriceProposalRequest:
      type: object
      required: [productId, price, currency, basedOnReferenceVersion]
      properties:
        productId: { type: string, format: uuid }
        price: { type: string, description: 'Décimal en chaîne, > 0, 2 décimales au plus' }
        currency: { type: string }
        basedOnReferenceVersion: { type: integer, format: int64, description: Version du prix de référence vue par le commerçant }
        note: { type: string, maxLength: 500 }

    ChannelPrice:
      type: object
      required: [productId, referencePrice, referenceVersion]
      properties:
        productId: { type: string, format: uuid }
        referencePrice: { type: string }
        referenceVersion: { type: integer, format: int64 }
        approved:
          description: Seul prix commercialisable ; absent si aucun prix approuvé
          type: [object, 'null']
          properties:
            price: { type: string }
            currency: { type: string }
            priceVersion: { type: integer, format: int64 }
            approvedAt: { type: string, format: date-time }
        pending:
          type: [object, 'null']
          properties:
            proposalId: { type: string, format: uuid }
            price: { type: string }
            status: { type: string, enum: [PROPOSED, APPROVED, REJECTED, WITHDRAWN, SUPERSEDED] }
            rejectionReason: { type: [string, 'null'] }
        referenceChangedSinceApproval: { type: boolean }

    Availability:
      description: |
        Disponibilité d'un produit, calculée au moment de servir la page (événement mince
        `AVAILABILITY`, P3 ; section `availability` de l'instantané) : stock des dépôts du périmètre moins
        les réservations, jamais négative. **`perWarehouse` exposé** (C8 tranché sur ce point, v11-D8) :
        détail par dépôt du périmètre ; un dépôt absent vaut 0 ; `available` = somme du détail.
        Périmètre calculé au moment de servir la page : au lot 2, dépôts vendables choisis par liaison et
        figés à l'autorisation (par défaut les dépôts `STORE` seulement, `WAREHOUSE` sur option explicite
        du commerçant) ; si l'utilisateur qui a autorisé la liaison perd ses droits, la liaison passe « à
        revoir » avec une alerte, sans changement silencieux du périmètre.
      type: object
      required: [productId, available, computedAt]
      properties:
        productId: { type: string, format: uuid }
        available: { type: integer, minimum: 0 }
        perWarehouse:
          type: array
          items:
            type: object
            required: [warehouseId, available]
            properties:
              warehouseId: { type: string, format: uuid }
              available: { type: integer, minimum: 0 }
        computedAt: { type: string, format: date-time }

    OnlineOrderRequest:
      description: Instantané commercial figé à la commande ; les prix sont vérifiés, jamais crus
      type: object
      required: [externalOrderId, createdAt, currency, customer, delivery, lines]
      properties:
        externalOrderId: { type: string, maxLength: 64, description: 'Order._id JeCréeMaBoutique ; avec la liaison, clé d''idempotence de la création (C4, v13-D5)' }
        createdAt: { type: string, format: date-time }
        currency: { type: string }
        customer:
          description: |
            Données personnelles minimales (v13-D5) : nom et téléphone **obligatoires**, aucun autre
            champ (pas d'e-mail). Durée de conservation : **ouverte**, fixée au lot 5 (D11).
          type: object
          required: [name, phone]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            phone: { type: string, minLength: 1, maxLength: 30 }
        delivery:
          description: |
            **Obligatoire** : retrait (`pickup`) **sans** adresse, ou livraison (`delivery`) **avec**
            adresse (v13-D5). Aucune version de JeCréeMaBoutique n'appelle encore cette route : aucune
            compatibilité à préserver. *(Première rédaction v13 : facultatif, pour les anciennes
            versions de l'application JeCréeMaBoutique sans mode de livraison.)*
          oneOf:
            - title: Retrait
              type: object
              required: [mode]
              additionalProperties: false
              properties:
                mode: { type: string, const: pickup }
            - title: Livraison
              type: object
              required: [mode, address]
              additionalProperties: false
              properties:
                mode: { type: string, const: delivery }
                address: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: '100 lignes au plus (v13-D5)'
          items:
            type: object
            required: [productId, quantity, unitPrice, priceVersion]
            properties:
              productId: { type: string, format: uuid }
              sku: { type: string }
              label: { type: string, maxLength: 200 }
              quantity: { type: integer, minimum: 1, maximum: 9999, description: '9 999 au plus (v13-D5 ; v12 et antérieures : 100 000)' }
              unitPrice:
                type: string
                description: |
                  Prix unitaire **effectivement facturé** par JeCréeMaBoutique ; doit égaler le prix
                  approuvé de `priceVersion`. Le prix de référence reste du côté de GestStock.
                  *(`discountPercent` retiré en v13-D5.)*
              priceVersion: { type: integer, format: int64 }

    OnlineOrderStatus:
      type: object
      required: [orderId, externalOrderId, status]
      properties:
        orderId: { type: string, format: uuid }
        externalOrderId: { type: string }
        status:
          type: string
          enum: [RECEIVED, CHECKED, REJECTED, RESERVED, REJECTED_STOCK, ACCEPTED, REFUSED, IN_PREPARATION, CONVERTED, CANCELLED, EXPIRED]
        reason: { type: [string, 'null'] }

    OnlineOrder:
      allOf:
        - $ref: '#/components/schemas/OnlineOrderStatus'
        - type: object
          properties:
            reservation:
              type: [object, 'null']
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [RESERVED, CONSUMED, CANCELLED, RELEASED, EXPIRED] }
                expiresAt: { type: string, format: date-time, description: Heure serveur PostgreSQL de création + durée configurée }
                allocations:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string, format: uuid }
                      warehouseId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
            saleIds:
              type: array
              description: Ventes créées au point de vente (une par dépôt si D4 retenue)
              items: { type: string, format: uuid }
