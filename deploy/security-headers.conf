# En-têtes de sécurité du front GestStock (copié dans /etc/nginx/snippets/ par le Dockerfile).
# Inclus au niveau du serveur ET dans chaque location qui ajoute ses propres en-têtes (deploy/nginx.conf.template) :
# dans nginx, un add_header de location remplace tous ceux hérités du serveur.
# Referrer-Policy : variable $geststock_referrer_policy, posée par le serveur et remplacée par une location qui
# l'exige (no-referrer sous /integrations/).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy $geststock_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
